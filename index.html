<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="이터널 리턴 실험체로 루미아 섬에서 살아남는 하드코어 텍스트 어드벤처">
<meta name="theme-color" content="#0b0f16">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>루미아 섬 생존 일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one scene card at a time, like a text adventure page. Sticky status band on top, Sticky status band on top, narrative log in one column, choices directly under the latest line, info tabs docked at the bottom. One dark look by choice. */
:root{
  --bg:#0b0f16;--panel:#121925;--panel2:#18212f;--line:#243145;
  --fg:#dce4ee;--dim:#8291a5;--cyan:#62d3e4;--amber:#ffb547;--red:#ff5a6e;--ok:#58c47a;--gold:#f2b233;--violet:#8f8cff;
  --g0:#a3acb7;--g1:#58c47a;--g2:#4a92ff;--g3:#b06bff;--g4:#f2b233;
  --display:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.muted{color:var(--dim)}
.g0{color:var(--g0)}.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}.g4{color:var(--g4)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);transition:width .3s}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.btn-main{background:var(--cyan);color:#06131a;border:0;border-radius:6px;padding:14px 18px;font-family:var(--display);font-size:21px;width:100%}
.btn-main:hover{filter:brightness(1.08)}
.badge{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:2px}
.badge.red{border-color:var(--red);color:var(--red)}.badge.amber{border-color:var(--amber);color:var(--amber)}.badge.cyan{border-color:var(--cyan);color:var(--cyan)}.badge.gold{border-color:var(--gold);color:var(--gold)}

/* select */
.sel{padding-block:40px 40px}
.hero{display:flex;flex-direction:column;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,60px);line-height:1.03;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{margin:0;color:var(--dim);max-width:36em}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:3}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.roster button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:100%}
.roster button:hover{border-color:var(--cyan)}
.roster b{font-family:var(--display);font-weight:400;font-size:19px}
.roster span{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* profile */
.prof{display:flex;flex-direction:column;gap:10px}
.prof-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prof h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.pw{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.1em}
.prof p{margin:0}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.kit dt{font-size:11.5px;color:var(--dim)}.kit dd{margin:0;font-size:14px}
.kit div:nth-child(3){grid-column:1/-1}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meters span{font-size:11.5px;color:var(--dim)}
.beh{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.beh .rel{color:var(--amber)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;background:var(--panel);border-top:1px solid var(--line);border-radius:12px 12px 0 0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel .x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--dim)}
.pbody{overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pbody h4{margin:6px 0 0;font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:12px 84px 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--dim)}
.tabs button.on{color:var(--fg);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:var(--panel2);border-radius:4px;padding:8px 10px;display:flex;justify-content:space-between}
.cell span{font-size:13px;color:var(--dim)}.cell b{font-family:var(--mono)}
.rec,.maplist,.who,.dex{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rec li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:6px}
.rec li.ok{color:var(--fg)}.rec li.ok b{color:var(--ok)}
.rec b{font-weight:500}
.maplist li{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.maplist li.cur{border-color:var(--cyan)}.maplist li.z{opacity:.6}
.maplist b{font-size:15px}
.who li{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.who li span{color:var(--dim);font-size:12.5px;text-align:right}
.who.dead b{color:var(--dim);text-decoration:line-through}
.dex button{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column}
.dex button span{font-size:12px;color:var(--dim)}
.dex li>div{padding:10px 4px 6px}

/* game */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hudwrap{padding-block:10px 10px;display:flex;flex-direction:column;gap:7px}
.h1{display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.h1 b{color:var(--fg);font-family:var(--mono)}
.h1 .ph{font-family:var(--display);font-weight:400;font-size:19px;color:var(--amber)}
.h1 .sp{flex:1}
.h2{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.h2 .me{font-family:var(--display);font-size:20px;margin-right:8px}
.h2 .loc{font-size:14px;color:var(--cyan)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bars span{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.bar.hp i{background:var(--ok)}.bar.san i{background:#8f8cff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.chip b{font-family:var(--mono);font-weight:600}
.chip.ally{border-color:var(--ok);color:var(--ok)}
.game{padding-block:14px 120px}
.card{display:flex;flex-direction:column;gap:12px}
.ctag{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--dim)}
.ctag span:first-child{color:var(--cyan);border:1px solid currentColor;border-radius:3px;padding:1px 7px;font-family:var(--body);letter-spacing:0}
.card.bad .ctag span:first-child{color:var(--red)}.card.warn .ctag span:first-child{color:var(--amber)}.card.good .ctag span:first-child{color:var(--ok)}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.1;margin:0;text-wrap:balance}
.card.bad h2{color:#ff8a98}
.ctext{border-left:2px solid var(--line);padding-left:14px;font-size:16px;line-height:1.75;max-width:36em}
.ctext p{margin:0 0 6px}
.chosen{color:var(--cyan);font-weight:700;padding-top:4px}
.result{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.result p{margin:0;font-size:14.5px}
.result p.news{font-size:12.5px;color:var(--dim)}.result p.warn{color:var(--amber)}.result p.bad{color:#ff8a98}.result p.good{color:#8fe0a8}
.result p.phase{font-family:var(--display);font-size:19px;color:var(--amber);padding-top:6px}
.result p.dead{color:var(--red);font-weight:700}.result p.win{color:var(--gold);font-weight:700}
.cont{margin-top:4px}
.result p.crit-bad,.result p.crit-good,.result p.crit-win,.journal .crit-bad,.journal .crit-good,.journal .crit-win{font-family:var(--display);font-size:18px;letter-spacing:.04em;padding-top:4px}
.result p.crit-bad,.journal .crit-bad{color:var(--red)}.result p.crit-good,.journal .crit-good{color:var(--ok)}.result p.crit-win,.journal .crit-win{color:var(--gold)}
.opt .d.req{color:var(--red)}
.use{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.use button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column}
.use button span{font-size:12px;color:var(--dim)}
.use button:disabled{opacity:.4;cursor:default}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.journal .pick{color:var(--cyan);padding-top:8px}.journal .news{color:var(--dim);font-size:12.5px}.journal .warn{color:var(--amber)}.journal .bad{color:#ff8a98}.journal .good{color:#8fe0a8}
.journal .phase{font-family:var(--display);font-size:18px;color:var(--amber);padding-top:12px}.journal .dead{color:var(--red)}.journal .win{color:var(--gold)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.e{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);font-size:14.5px;overflow-wrap:anywhere}
.e.pick{color:var(--cyan);font-size:13px;border:0;padding:10px 0 2px}
.e.pick span{margin-right:6px}
.e.news{font-size:13px;color:var(--dim);font-family:var(--body)}
.e.warn{color:var(--amber)}
.e.bad{color:#ff8a98}
.e.good{color:#8fe0a8}
.e.phase{font-family:var(--display);font-size:21px;color:var(--amber);text-align:center;padding:18px 0 8px;border-bottom:1px solid var(--amber)}
.e.dead{color:var(--red);font-weight:700}
.e.win{color:var(--gold);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;padding-top:14px;scroll-margin-top:160px}
.head{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:5px;padding:12px 14px;font-size:15px}
.head.bad{border-left-color:var(--red)}.head.warn{border-left-color:var(--amber)}.head.good{border-left-color:var(--ok)}
.olist{display:grid;grid-template-columns:1fr;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt:hover{border-color:var(--cyan)}
.opt .l{font-weight:700;font-size:14.5px}
.opt .d{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.opt.hot{border-color:var(--gold)}.opt.hot .l{color:var(--gold)}
.opt.urgent{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel2));grid-column:1/-1}.opt.urgent .l{color:var(--red)}
.opt.warn .l{color:var(--red)}
.opt.dis{opacity:.4;cursor:default}
.opt.back{background:none;grid-column:1/-1;align-items:center}
.fight{display:grid;gap:6px;background:color-mix(in srgb,var(--red) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 50%,var(--line));border-radius:6px;padding:10px 12px}
.ftitle{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--red)}
.fc{display:grid;grid-template-columns:minmax(0,1fr) auto 90px 34px;gap:8px;align-items:center;font-size:13.5px}
.fc span{font-size:11.5px}.fc em{font-style:normal;font-family:var(--mono);font-size:12px;text-align:right}
.fc.down{opacity:.4}.fc.friend span{color:var(--ok)}.fc.friend .bar i{background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.dock button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 0;font-size:13px}
.end{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.end.w{border-color:var(--gold)}
.end .et{font-family:var(--display);font-size:30px;line-height:1.1;color:var(--amber);text-wrap:balance}
.end.w .et{color:var(--gold)}
.end p{margin:0;font-size:14px}
.end dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.end dt{font-size:11.5px;color:var(--dim)}.end dd{margin:0;font-family:var(--mono);font-weight:600}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:8px 10px;border:2px solid currentColor;border-radius:8px}
.grade span{font-size:11px;letter-spacing:.08em;color:var(--dim)}
.grade b{font-family:var(--display);font-weight:400;font-size:48px;line-height:1}
.grade.g-D{color:var(--g0)}.grade.g-C{color:var(--g1)}.grade.g-B{color:var(--g2)}.grade.g-A{color:var(--g3)}.grade.g-S{color:var(--g4)}
.pts{display:flex;flex-direction:column;min-width:0}
.pts span{font-size:11.5px;color:var(--dim)}.pts b{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}.pts small{color:var(--dim);font-size:12px}
.breakdown{width:100%;border-collapse:collapse;font-size:13.5px}
.breakdown th{text-align:left;font-weight:500;color:var(--dim);padding:4px 0;width:34%}
.breakdown td{padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.breakdown td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;width:72px}
.card.hidden .ctag span:first-child{color:var(--gold)}.card.hidden h2{color:var(--gold)}.card.hidden .ctext{border-left-color:var(--gold)}
.acts{display:flex;gap:8px}
.acts button,.copy{flex:1;padding:12px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.acts .again{background:var(--cyan);color:#06131a;border-color:var(--cyan)}
.copied{font-size:12.5px;color:var(--ok);white-space:pre-wrap}
@media (max-width:380px){.olist{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== utils ===== */
const rnd=Math.random, ri=(a,b)=>Math.floor(a+rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)], ch=p=>rnd()<p, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wpick(arr,wf){const w=arr.map(wf);const t=w.reduce((a,b)=>a+b,0);if(t<=0)return null;let r=rnd()*t;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
function J(w,p){const c=w.charCodeAt(w.length-1);const k=c>=0xac00&&c<=0xd7a3?(c-0xac00)%28:0;const P={'이':['이','가'],'을':['을','를'],'은':['은','는'],'과':['과','와'],'으로':['으로','로']}[p];if(p==='으로'&&k===8)return w+'로';return w+(k?P[0]:P[1])}

/* ===== world ===== */
const AREAS=['항구','창고','연못','병원','학교','고급 주택가','양궁장','골목길','숲','성당','모래사장','호텔','절','공장','소방서','경찰서','개울','묘지','연구소'];
const LAB='연구소';
const ADJ0={'항구':['창고','개울','소방서'],'창고':['공장','개울','학교'],'연못':['병원','절','숲','묘지'],'병원':['묘지','성당','숲'],'학교':['소방서','양궁장','호텔','연구소'],'고급 주택가':['골목길','양궁장','성당'],'양궁장':['골목길','호텔'],'골목길':['경찰서'],'숲':['절','모래사장','연구소'],'성당':['묘지','경찰서'],'모래사장':['호텔','절'],'호텔':['연구소'],'공장':['묘지','소방서'],'소방서':['경찰서'],'경찰서':['연구소'],'개울':['묘지']};
const ADJ={};AREAS.forEach(a=>ADJ[a]=new Set());for(const a in ADJ0)for(const b of ADJ0[a]){ADJ[a].add(b);ADJ[b].add(a)}
for(const a in ADJ)ADJ[a]=[...ADJ[a]];

/* ===== NPC simulation ===== */
function npcStep(){
  const me=G.me;
  for(const n of shuffle(alive())){
    if(n.busy)continue;
    if(n.team==='me'){n.area=me.area;n.hp=Math.min(npcMax(n),n.hp+4);continue}
    if(n.team&&n.team!==n.c.id){const L=G.npcs.find(x=>x.c.id===n.team);if(L&&L.alive){n.area=L.area;n.hp=Math.min(npcMax(n),n.hp+3);continue}n.team=null}
    {const mx=npcMax(n);if(n.hp>=mx-8&&n.hp<mx)n.hp=mx;n.hp=Math.min(mx,n.hp+(n.c.idle==='heal'?4:2));}
    const gp={farm:.055,camp:.04,trap:.035,heal:.03,hunt:.035,stalk:.035,roam:.035}[n.c.idle];
    if(n.g<4&&ch(gp))n.g++;
    const danger=G.zones.has(n.area)||(G.next.includes(n.area)&&G.tick>=TPP-3);
    const prevArea=n.area;
    if(G.phase>=FINAL){if(n.area!==LAB){n.area=ADJ[n.area].reduce((b,a)=>DIST[a]<DIST[b]?a:b)}}
    else if(danger||ch(MOVEP[n.c.idle])){
      const to=wpick(ADJ[n.area],a=>{if(G.zones.has(a))return .02;let w=1;if(n.c.haunt.includes(a))w*=4;if(G.next.includes(a))w*=.3;if(a===me.area&&(n.c.idle==='hunt'||n.c.idle==='stalk')&&G.phase>=2)w*=3;if(G.specials[a])w*=1.5;if(G.drop===a)w*=1.5;return w});
      if(to)n.area=to;
    }
    if(n.area!==prevArea){
      const mem=G.npcs.filter(x=>x.alive&&x.team===n.c.id&&x!==n);mem.forEach(x=>x.area=n.area);
      if(G.ptraps[n.area]&&ch(.45)){G.ptraps[n.area]--;const d=ri(35,60);n.hp-=d;log(`[덫] ${n.area}에 설치한 덫이 작동했다. ${J(nm(n),'이')} 걸렸다.`,'good');if(n.hp<=0){G.me.kills++;G.me.killed.push(nm(n));kill(n,`처치: ${G.me.p.n}의 덫 · ${n.area}`,'me')}}
    }
    if(!n.alive)continue;
    if(G.zones.has(n.area)&&ch(.35)){kill(n,`${n.area} 금지구역 탈출 실패`,null);continue}
    if(n.c.tags.includes('trapper')&&ch(.22))G.ntraps[n.area]=n.c.id;
    if(G.specials[n.area]&&ch(.3)){delete G.specials[n.area];n.g=Math.min(4,n.g+1)}
    if(G.drop===n.area&&ch(.35)){G.drop=null;n.g=Math.min(4,n.g+1)}
    if(G.boss&&G.boss.area===n.area&&n.c.agg>.45&&ch(.1)){
      if(ch(.45)){log(`[방송] ${G.boss.name} 처치 · ${nm(n)}`,'news');n.g=4;G.boss=null}
      else kill(n,`${G.boss.name}에게 당함 · ${n.area}`,null);
    }
    if(n.alive&&ch(.002+G.phase*.0007))kill(n,`${n.area}에서 ${night()?pick(['늑대','곰','변이체']):pick(['멧돼지','들개'])}에게 당함`,null);
  }
  // group interactions away from the player
  const byArea={};
  for(const n of alive()){if(n.team==='me'||n.area===me.area||n.busy)continue;(byArea[n.area]=byArea[n.area]||{});const k=n.team||n.c.id;(byArea[n.area][k]=byArea[n.area][k]||[]).push(n)}
  for(const a in byArea){
    const gs=Object.values(byArea[a]);
    if(gs.length<2)continue;
    const [A,B]=shuffle(gs);
    if(A.some(x=>B.some(y=>bonded(x.c,y.c)))&&A.length+B.length<=3){merge(A,B);continue}
    const hate=A.some(x=>B.some(y=>hatesP(x.c,y.c)));
    const f=Math.max(leader(A).c.agg,leader(B).c.agg)*.32*(.7+G.phase*.09)+(hate?.6:0)+(G.phase>=FINAL?.3:0);
    if(ch(f))npcBattle(A,B);
    else if(A.length+B.length<=3&&ch(Math.min(leader(A).c.ally,leader(B).c.ally)*.18))merge(A,B);
  }
  // betrayal inside NPC teams late game
  if(G.phase>=4)for(const n of alive()){if(n.team&&n.team!=='me'&&ch(n.c.bt*.012)){const mates=G.npcs.filter(x=>x.alive&&x!==n&&x.team===n.team&&!bonded(x.c,n.c));if(mates.length){const v=pick(mates);n.team=null;kill(v,`처치: ${nm(n)} (동맹 배신) · ${n.area}`,nm(n));n.kills++;break}}}
}
function merge(A,B){const L=leader(A);[...A,...B].forEach(x=>x.team=L.c.id)}
const groupPow=g=>g.reduce((s,n)=>s+npcPow(n)*(.5+n.hp/200),0);
function npcBattle(A,B){
  const pa=groupPow(A)+ri(0,28),pb=groupPow(B)+ri(0,28);
  const[W,L]=pa>=pb?[A,B]:[B,A];const k=leader(W);
  for(const n of L){
    if(!n.alive)continue;
    if(ch(.72)){k.kills++;if(ch(.4))k.g=Math.min(4,k.g+1);kill(n,`처치: ${nm(k)} · ${n.area}`,nm(k))}
    else{n.hp=Math.max(8,n.hp-45);n.team=null;n.area=pick(ADJ[n.area].filter(a=>!G.zones.has(a)))||n.area}
  }
  W.forEach(n=>n.hp=Math.max(6,n.hp-ri(10,40)));
  return W.filter(n=>n.alive);
}

const full=v=>{G.me.full=clamp(G.me.full+v,0,100)};

/* ---------- time ---------- */
function tick(){
  const me=G.me,ph=G.phase;

  if(G.tick>=TPP)nextPhase();
  if(G.over)return;
  if(G.phase!==ph)queue(()=>broadcastCard());
  full((night()?-2.3:-1.8)*(me.p.role==='support'?.8:1));
  if(me.full>50&&!me.bleed&&me.hp<me.max)me.hp=Math.min(me.max,me.hp+(me.full>75?2:1));
  if(me.full<=0){me.full=0;if(hurt(4,'hunger','굶주림 끝에 다리가 풀렸다. 다시 일어나지 못했다.'))return;log('배가 너무 고프다. 힘이 빠져나간다. (체력 -4)','bad')}
  else if(me.full<20&&ch(.4))log('허기가 몰려온다. 뭐라도 먹어야 한다.','warn');
  if(G.zones.has(me.area)&&!G.fight){me.zt--;if(me.zt<=0)return die('zone',`${me.area}의 금지구역 장치가 작동했다. 손목에서 불빛이 번쩍였다.`);log(`[경고] 금지구역 체류 중. ${me.zt}턴 안에 벗어나야 한다.`,'warn')}
  else me.zt=G.phase>=FINAL?1:ZT;
  if(me.cursed&&ch(.5)){san(-1);if(ch(.08))log('손에 쥔 권총이 속삭인다. "더, 더."','news')}
  if(me.drunk>0)me.drunk--;
  if(me.charm&&ch(.2))san(1);
  if(!me.berserk)san(night()?-1.3:(ch(.45)?-1:0));
  if(me.bleed){if(hurt(2,'bleed','피를 너무 많이 흘렸다. 시야가 하얗게 바랬다.'))return;log('상처에서 피가 배어 나온다. (체력 -2)','bad')}
  if(night()&&!INDOOR.has(me.area)&&ch(.35)){me.hp-=1;log('밤바람이 뼛속까지 스민다. (체력 -1)','news')}
  if(me.berserk){if(hurt(3,'mad','광기에 몸을 맡긴 대가로 몸이 먼저 무너졌다.'))return}
  for(const a of allies()){
    if(a.c.tags.includes('healer')&&me.hp<me.max&&ch(.4)){heal(5);if(me.bleed&&ch(.5)){me.bleed=false}log(`${J(nm(a),'이')} 상처를 봐 줬다. (체력 +5)`,'good')}
    else if(a.c.tags.includes('support')&&ch(.4)){san(4);log(`${nm(a)} 덕분에 조금 마음이 놓인다. (정신 +4)`,'good')}
    else if(a.c.tags.includes('cook')&&ch(.25)){me.it.meal++;log(`${J(nm(a),'이')} 요리를 나눠 줬다. (음식 +1)`,'good')}
  }
  if(me.inv.food>1&&ch(.06)){me.inv.food--;log('가방 속 식량 하나가 상해 버렸다. (식량 -1)','bad')}
  if(ch(.02)){const ks=Object.keys(MATN).filter(k=>me.inv[k]>0);if(ks.length){const k=pick(ks);me.inv[k]--;log(`잠깐 한눈판 사이 누군가 가방을 뒤졌다. (${MATN[k]} -1)`,'bad')}}
  if(me.wg>=2&&ch(.008)){me.wg--;log(`무기에 금이 갔다. 등급이 ${GR[me.wg]}로 떨어졌다.`,'bad')}
  if(me.exposed>0){me.exposed--;if(ch(.5))pullNpc('아글라이아 드론이 당신의 위치를 방송했다. 누군가 오고 있다.')}

  }

}

/* ---------- flow ---------- */
function pickOpt(o){
  if(o.dis||G.over||G.mode!=='card')return;
  const mark=G.log.length;
  G.choices++;log(o.l,'pick');
  G.me.stealthUsed=false;
  {const tag=G.card&&G.card.tag;const tw=typeof rollTwist==='function'?rollTwist(o,tag):{mode:'normal'};if(tw.mode==='normal')o.f();else applyTwist(tw,tag,o)}
  if(!G.over&&!G.fight&&!G.chain&&G.card&&!['교전','기습','방송','경고'].includes(G.card.tag)&&ch(.015+G.phase*.006)){
    const c=npcsAdj().concat(others().filter(n=>n.area===G.me.area)).filter(n=>!n.busy&&n.c.agg>=.5&&!bonded(n.c,G.me.p));
    if(c.length){const n=pick(c);log('그 순간, 등 뒤에서 발소리가 빠르게 다가왔다!','bad');chain(()=>ambushCard(n))}
  }
  if(!G.over&&!o.noTick)tick();
  G.result={lines:G.log.slice(mark+1)};
  G.mode='result';
}
function cont(){
  if(G.over){G.mode='over';return}
  let c=null;
  if(G.chain){const f=G.chain;G.chain=null;c=f()}
  while(!c&&G.queue.length)c=G.queue.shift()();
  if(!c&&!G.over&&!others().length){c=finalCard()}
  if(G.over){G.mode='over';return}
  if(!c)c=drawCard();
  if(G.zones.has(G.me.area)&&!c.fight&&c.tag!=='경고'){c={...c,opts:[...bestMoves().slice(0,2).map(m=>({l:`금지구역 탈출: ${J(m.a,'으로')}`,d:`남은 시간 ${G.me.zt}턴`,urgent:1,f:()=>move(m.a)})),...c.opts]}}
  G.card=c;G.mode='card';G.result=null;G.cardMark=G.log.length;
}

/* ---------- card draw ---------- */
function drawCard(){
  const me=G.me,a=me.area;
  if(G.zones.has(a))return zoneCard();
  if(G.phase>=FINAL&&a!==LAB)return travelCard(true);
  const C=[];const add=(w,f)=>{if(w>0)C.push([w,f])};
  const gs=groupsAt(a);
  if(gs.length>=2)add(G.phase>=FINAL?12:4,()=>witnessCard(gs[0],gs[1]));
  if(gs.length)add(G.phase>=FINAL?30:7,()=>npcCard(gs[0]));
  if(npcsAdj().some(n=>n.c.idle==='stalk'))add(1.2,()=>stalkerCard());
  {const amb=npcsAdj().concat(others().filter(n=>n.area===a)).filter(n=>!n.busy&&n.c.agg>=.45&&!bonded(n.c,me.p));if(amb.length)add(.15+G.phase*.1+(night()?.3:0)+(me.hp<50?.15:0),()=>ambushCard(pick(amb)))}
  add(1.4+me.moved*.9+(G.next.includes(a)?6:0),()=>travelCard());
  if(G.drop===a)add(8,()=>dropCard());
  if(G.specials[a])add(8,()=>specialCard());
  if(G.boss&&G.boss.area===a)add(6,()=>bossCard());
  {const rc=recipes().filter(canPay);if(rc.length)add(rc.some(r=>/강화|방어구/.test(r.l))?8:1.8,()=>benchCard())}
  if(me.full<40)add(me.full<20?6:2.5,()=>hungerCard());
  if(me.hp<70)add(me.hp<40?6:3.5,()=>restCard());
  if(WILD.has(a)||night())add(night()?2.2:1.4,()=>beastCard());
  add(G.ntraps[a]?4:.7,()=>trapCard());
  if(allies().length)add(1.6,()=>allyCard());
  if(me.san<35)add(2.6,()=>hallucinationCard());else if(night()&&me.san<60)add(.5,()=>hallucinationCard());
  for(const s of SCENES){if(!s.c||s.c(a)){const seen=G.seenScenes[s.id+a]||0;const nd=s.need==='food'?(me.full<30?3:me.full<55?1.8:.7):s.need==='hp'?(me.hp<me.max*.35?3:me.hp<me.max*.65?1.8:.6):1;add(s.w*nd*(seen?.35:1),()=>{G.seenScenes[s.id+a]=seen+1;return s.make(a)})}}
  for(let i=0;i<6;i++){const f=wpick(C,x=>x[0]);const c=f[1]();if(c)return c}
  return travelCard();
}

/* ---------- moves & small actions ---------- */
function move(a){
  const me=G.me;if(G.zones.has(a)&&!G.zones.has(me.area))me.zt=Math.max(me.zt,2);me.area=a;me.moved=0;allies().forEach(x=>x.area=a);
  log(`${J(a,'으로')} 이동했다.${G.zones.has(a)?' 이곳은 금지구역이다!':''}`);
  if(G.ntraps[a]&&!me.scouted.has(a)&&ch(.45)){
    const o=BY[G.ntraps[a]];delete G.ntraps[a];const d=ri(16,30);san(-5);
    if(hurt(d,'trap',`${o.n}의 덫을 밟고 쓰러졌다.`))return;
    log(`발밑에서 딸깍 소리가 났다. ${o.n}의 덫이다! (체력 -${d})`,'bad');
  }
}
function safeDist(a){const seen={[a]:0},q=[a];while(q.length){const x=q.shift();if(!G.zones.has(x))return seen[x];for(const y of ADJ[x])if(seen[y]==null){seen[y]=seen[x]+1;q.push(y)}}return 99}
function bestMoves(){
  const me=G.me;
  return ADJ[me.area].map(a=>{
    const tags=[];if(G.zones.has(a))tags.push('금지구역');else if(G.next.includes(a))tags.push('곧 금지');
    if(G.specials[a])tags.push(G.specials[a]);if(G.drop===a)tags.push('보급');if(G.boss&&G.boss.area===a)tags.push(G.boss.name);
    if(G.phase>=FINAL&&a===LAB)tags.push('안전');
    const seen=others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).map(nm);if(seen.length)tags.push('목격: '+seen.slice(0,2).join('·'));
    const score=-safeDist(a)*4+(G.zones.has(a)?-5:0)+(G.next.includes(a)?-2:0)+(G.specials[a]?3:0)+(G.drop===a?2:0)+(G.phase>=FINAL?-DIST[a]*5:0)+rnd()*1.5;
    return{a,tags,score};
  }).sort((x,y)=>y.score-x.score);
}
function openDrop(){const me=G.me;G.drop=null;const r=rnd();
  if(r<.4&&me.wg<3){me.wg++;log(`상자 안에 ${GR[me.wg]} 등급 무기 부품이 있었다.`,'good')}
  else if(r<.7&&me.ag<3){me.ag++;log(`상자 안에 ${GR[me.ag]} 등급 방어구가 있었다.`,'good')}
  else{me.it.bandage+=2;me.it.meal++;log('상자 안에 붕대 2개와 음식이 있었다.','good')}
}
function takeSpecial(){const me=G.me;const s=G.specials[me.area];delete G.specials[me.area];me.sp[s]=(me.sp[s]||0)+1;log(`${J(s,'을')} 손에 넣었다. 전설 등급 제작 재료다.`,'good')}
function setTrap(){G.me.it.trap--;G.ptraps[G.me.area]=(G.ptraps[G.me.area]||0)+1;log(`${G.me.area}에 덫을 숨겨 설치했다.`)}
function useItem(k){const me=G.me;if(!me.it[k]&&k!=='food')return;
  if(k==='food'){if(!me.inv.food)return;me.inv.food--;full(22);log('식량을 먹었다. (포만감 +22)');return}
  me.it[k]--;
  if(k==='bandage'){heal(20);me.bleed=false;log('붕대를 감았다. 피가 멎었다. (체력 +20)')}
  if(k==='meal'){heal(10);full(35);san(3);log('음식을 먹었다. (체력 +10, 포만감 +35)')}
  if(k==='sedative'){san(18);log('진정제를 삼켰다. 손 떨림이 조금 멎었다. (정신 +18)')}
}

/* ---------- subjects ---------- */
function groupsAt(area){const m={};for(const n of alive()){if(n.area!==area||n.team==='me'||n.busy)continue;const k=n.team||n.c.id;(m[k]=m[k]||[]).push(n)}return Object.values(m)}
function joinMe(g){g.forEach(n=>{n.team='me';n.area=G.me.area;n.hostile=false;if(!G.me.allyHist.includes(nm(n)))G.me.allyHist.push(nm(n))});log(`${J(names(g),'과')} 동맹을 맺었다.`,'good')}
function canJoin(g){return allies().length+g.length<=2}
function stanceOf(g){
  if(G.me.hp<45&&ch(.08))return'attack';
  const me=G.me,L=leader(g),c=L.c,P=me.p;
  if(g.some(n=>n.vendetta===P.n))return'vendetta';
  if(g.some(n=>bonded(n.c,P)))return'bond';
  if(g.some(n=>hatesP(n.c,P)))return'hate';
  if(me.ambush)return'mine';
  if(me.berserk)return ch(.5)?'flee':'attack';
  if(g.some(n=>n.hostile))return'attack';
  if(G.phase>=FINAL)return ch(.75)?'attack':'standoff';
  if(ch(c.agg*(.05+G.phase*.05)+(me.hp<40?.06:0)))return'attack';
  if(canJoin(g)&&ch(c.ally*(1-G.phase*.07)))return'offer';
  if(c.idle==='heal'&&me.hp<65&&ch(.6))return'heal';
  if(['camp','farm','trap'].includes(c.idle)&&ch(.7))return c.idle;
  return'standoff';
}
const powLabel=g=>{const r=myPow()+allies().length*12-g.reduce((s,n)=>s+npcPow(n)*(.5+n.hp/200),0)-(g.length-1)*8;return r>12?'상대가 약해 보인다':r>-6?'비등해 보인다':'상대가 훨씬 강해 보인다'};
const ATK_T=[n=>`${J(n,'이')} 망설임 없이 달려들었다.`,n=>`풀숲에서 ${J(n,'이')} 튀어나왔다. 먼저 손을 쓴 쪽은 상대였다.`,n=>`${J(n,'이')} 웃으며 무기를 들었다. 대화할 생각은 없어 보인다.`,n=>`등 뒤에서 바람 소리가 났다. ${n}의 기습이다!`];
function npcCard(g,force){
  g=g.filter(n=>n.alive);if(!g.length)return null;
  const me=G.me,L=leader(g),c=L.c,N=names(g);const a=me.area;

  const st=force||stanceOf(g);me.ambush=false;

  const tagT={tag:'조우',title:N};
  const atk=(t)=>({...tagT,tag:'기습',cls:'bad',text:t+` ${look}`,opts:[
    {l:'맞받아친다',f:()=>startFight(g,'foe')},
    {l:'방어 자세로 버틴다',d:'첫 공격 피해 감소',f:()=>startFight(g,'foe',[],.5)},
    {l:'피하며 도망친다',d:odds(.45),f:()=>{if(ch(.45)){const ok=ADJ[a].filter(x=>!G.zones.has(x));move(pick(ok.length?ok:ADJ[a]));log('간신히 따돌렸다.')}else{log('도망칠 틈이 없었다!','bad');startFight(g,'foe',[],1.2)}}},
  ]});
  if(st==='vendetta'){const v=g.find(n=>n.vendetta===me.p.n);return atk(v.c.id==='seres'?`"아가씨를 해친 대가다." 세레스의 검이 먼저 날아왔다.`:`${J(nm(v),'이')} 이를 갈며 달려들었다. "네가 죽였지."`)}
  if(st==='hate'){const h=g.find(n=>hatesP(n.c,me.p));return atk(hateLine(h.c,me.p))}
  if(st==='attack')return atk(pick(ATK_T)(N));
  if(st==='flee'){return{...tagT,text:`${J(N,'은')} 당신의 눈빛을 보고 얼어붙었다.`,opts:[{l:'쫓아간다',f:()=>startFight(g,'me')},{l:'보내 준다',f:()=>{g.forEach(n=>n.area=pick(ADJ[n.area]));log(`${J(N,'이')} 달아났다.`)}}]}}
  if(st==='bond'){const b=g.find(n=>bonded(n.c,me.p));return{...tagT,tag:'재회',cls:'good',text:bondLine(b.c,me.p),opts:[
    {l:'함께 간다',f:()=>{const jg=[b,...g.filter(x=>x!==b)].slice(0,2);while(allies().length+jg.length>2){const x=allies()[0];x.team=null;log(`${J(nm(x),'은')} 자리를 비켜 줬다.`)}g.filter(x=>!jg.includes(x)).forEach(x=>x.team=null);joinMe(jg)}},
    {l:'혼자 가겠다고 한다',f:()=>{log(`${J(nm(b),'은')} 잠시 말없이 서 있다가 붕대 하나를 건네고 물러났다.`);me.it.bandage++}}]}}
  if(st==='mine')return{...tagT,tag:'매복',text:`숨어 있던 자리 앞으로 ${J(N,'이')} 지나간다. 아직 눈치채지 못했다. ${look}`,opts:[
    {l:'기습한다',d:'선공 · 큰 피해',f:()=>startFight(g,'me')},
    {l:'모습을 드러내고 동맹을 제안한다',f:()=>propose(g)},
    {l:'숨죽이고 보낸다',f:()=>log(`${J(N,'은')} 아무것도 모른 채 지나갔다.`)}]};
  if(st==='offer'){
    const line=c.bt>=.6?`${J(N,'이')} 활짝 웃으며 손을 내밀었다. "우리 같은 편 하자. 응?"`:`${J(N,'이')} 무기를 내리고 손을 내밀었다. "같이 움직이지 않을래?"`;
    return{...tagT,tag:'제안',text:`${line} ${c.d}`,opts:[
      {l:'손을 잡는다',f:()=>joinMe(g)},

  }

const foeName=f=>f.kind==='boss'?f.b.name:nm(f.n);
const foePow=f=>f.kind==='boss'?f.b.pow:npcPow(f.n);
const foeHp=f=>f.kind==='boss'?f.b.hp:f.n.hp;
const foeMax=f=>f.kind==='boss'?f.b.max:npcMax(f.n);
const foeUp=f=>!f.gone&&(f.kind==='boss'?f.b.hp>0:f.n.alive);
const mLvlNpc=n=>Math.min(9,n.c.m0+Math.floor(G.phase*.4)+Math.floor(n.kills/3));
function gainXp(x){const m=G.me;if(m.ml>=9)return;m.xp+=x;let need=10+m.ml*6;while(m.ml<9&&m.xp>=need){m.xp-=need;m.ml++;log(`${m.p.w} 숙련도가 ${MG[m.ml]}로 올랐다.`,'good');need=10+m.ml*6}}
function atkOf(s){
  if(s==='me'){const m=G.me;return (8+m.wg*7.5)*ROLE[m.p.role].atk*(1+m.ml*.08)*(m.cursed?1.15:1)*(m.drunk>0?1.1:1)*(m.berserk?1.3:1)*(m.san<25?.9:1)}
  if(s.kind==='boss')return s.b.pow*.42;
  const n=s.n||s;return (13+n.g*6)*ROLE[n.c.role].atk*(1+mLvlNpc(n)*.07)*(.6+G.phase*.045)*(n.c.tags.includes('night')&&night()?1.15:1);
}
function dmgTo(t,raw){
  const v=.85+rnd()*.3;
  if(t==='me'){const m=G.me;return Math.max(2,Math.round(raw*(1-m.ag*.08)*ROLE[m.p.role].def*v))}
  if(t.kind==='boss')return Math.max(2,Math.round(raw*v));
  const n=t.n||t;return Math.max(2,Math.round(raw*(1-n.g*.05)*ROLE[n.c.role].def*v));
}
const myHit=f=>dmgTo(f,atkOf('me'));
const foeHit=(f,mult=1)=>dmgTo('me',atkOf(f)*mult);

function fightRound(act){

 {id:'rps',w:.7,c:()=>anyNpc().length>0,make:a=>{const n=pick(anyNpc());const g=npcHere(n);return{tag:'밈',title:'가위바위보',text:`${J(nm(n),'과')} 마주쳤다. 둘 다 체력이 애매하다. ${J(nm(n),'이')} 갑자기 주먹을 내밀었다. "싸우기 귀찮다. 가위바위보로 하자. 진 사람이 재료 다 놓고 가기."`,opts:['가위','바위','보'].map(x=>({l:`${x}!`,f:()=>{const r=rnd();if(r<.4){log(`${nm(n)}: "…쳇." 재료를 던지고 갔다. (${gain({[pick(['metal','cloth','food','powder'])]:2})})`,'good');g.forEach(m=>m.area=pick(ADJ[m.area]))}else if(r<.75){const ks=Object.keys(MATN).filter(k=>G.me.inv[k]>0);ks.forEach(k=>G.me.inv[k]=Math.floor(G.me.inv[k]/2));log(`졌다. 약속은 약속이다. 재료 절반을 내줬다.`,'bad');g.forEach(m=>m.area=pick(ADJ[m.area]))}else{log(`비겼다. ${nm(n)}: "…그냥 싸우자."`,'warn');startFight(g,null)}}}))}}},
 {id:'cs',w:.5,make:a=>({tag:'밈',title:'고객센터',text:'벽에 붙은 인터폰에 "아글라이아 실험체 고객센터"라고 적혀 있다. 버튼을 누르자 경쾌한 음악이 흘러나온다. "현재 대기 인원 999명입니다."',opts:[

 ]})},

 ]})},
 {id:'stream',w:.5,c:()=>!!byId('eleven')||ch(.5),make:a=>{const e=byId('eleven');return{tag:'밈',title:'생방송 중',text:e?'"안녕하세요 여러분~ 오늘은 루미아 섬 길거리 음식 먹방!" 일레븐이 셀카봉을 들고 걸어온다. 카메라가 당신을 비춘다. "앗, 게스트다!"':'버려진 셀카봉에 휴대폰이 꽂혀 있다. 화면에 "LIVE · 시청자 1.2만"이 떠 있다. 채팅창이 미친 듯이 올라간다.',opts:[

   {l:'"구독과 좋아요 부탁드립니다"',f:()=>{san(6);log('채팅창이 "ㅋㅋㅋㅋㅋㅋ"로 가득 찼다. 잠깐 웃었다.')}},

 ]}}},

 {id:'scam',w:.6,c:()=>!!byId('shoichi')||!!byId('haze'),make:a=>{const n=byId('shoichi')||byId('haze');const g=npcHere(n);return{tag:'밈',title:'투자 권유',text:`${J(nm(n),'이')} 친근하게 어깨동무를 한다. "형님/누님, 좋은 기회가 있는데. 지금 금속 2개 넣으면 다음 낮에 4개로 돌려줄게. 원금 보장. 진짜야."`,opts:[

   {l:'"운명 같은 거 안 믿어"',f:()=>log('그 순간 머리 위로 비둘기 똥이 떨어졌다.')},

function rollTwist(o,tag){
  if(!tag||TW_NONE.has(tag)||o.urgent||o.noTwist)return{mode:'normal'};
  const src=o.f.toString();
  const random=/\bch\(|rnd\(\)/.test(src);
  const flow=TW_FLOW.test(src);
  const cost=!!o.req||/inv\.\w+--|it\.\w+--|-=\d/.test(src);
  const luck=(G.me.charm?.03:0)-(G.me.cursed?.03:0)+(G.me.san<30?-.04:0);
  const r=rnd();
  const canSkip=TW_SKIP.has(tag)&&!random&&!flow&&!cost;
  const pBad=(random?.08:canSkip?.2:.12)-luck, pGood=(random?.08:.16)+luck, pJack=.025+luck/3;
  if(r<pBad)return{mode:canSkip?'fail':'bad'};
  if(r<pBad+pJack)return{mode:'jackpot'};
  if(r<pBad+pJack+pGood)return{mode:'good'};
  return{mode:'normal'};
}
function applyTwist(t,tag,o){
  const grp=twGroup(tag);
  if(t.mode==='fail'){G.me.st.fail++;log('▼ 대실패','crit-bad');pick(FAIL[grp]||FAIL.explore)();return true}
  o.f();
  if(G.over||G.fight)return true;
  if(t.mode==='bad'){log('▼ 일이 꼬였다','crit-bad');pick(grp==='social'?FAIL.explore.slice(0,3):(FAIL[grp]||FAIL.explore))()}
  else if(t.mode==='good'){log('▲ 운이 따랐다','crit-good');pick(BONUS)()}
  else if(t.mode==='jackpot'){G.me.st.jack++;log('★ 대성공','crit-win');pick(JACKPOT)()}
  return true;
}

/* ---------- score ---------- */
const RGRADES=['D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+','S-','S','S+'];
const RCUT=[0,600,1000,1400,1800,2200,2600,3000,3400,3800,4300,4800,5400,6100,7000];
function scoreRun(){
  const o=G.over,m=G.me,st=m.st;
  const rank=o.win?1:o.rank;
  const rows=[
    ['순위',`${rank}위`,Math.max(0,(25-rank))*45+(o.win?600:0)+(o.kind==='escaped'?900:0)],
    ['생존 시간',phaseName(o.phase),(o.phase+1)*80],
    ['처치',`${m.kills}명`,m.kills*140],
    ['보스 처치',`${st.boss}회`,st.boss*300],
    ['장비',`${GR[m.wg]} / ${GR[m.ag]}`,(m.wg+m.ag)*70],
    ['숙련도',MG[m.ml],m.ml*60],
    ['사냥',`${st.hunt}회`,st.hunt*25],
    ['동맹',`${m.allyHist.length}명`,m.allyHist.length*40],
    ['살려 보냄',`${st.spare}회`,st.spare*60],
    ['배신',`${m.betrayer}회 함 · ${m.betrayed}회 당함`,m.betrayer*50+m.betrayed*40],
    ['대성공',`${st.jack}회`,st.jack*90],
    ['히든 발견',`${st.hidden.length}/${HIDDEN_TOTAL}`,st.hidden.length*350],
    ['선택',`${G.choices}회`,G.choices*4],
  ];
  const total=rows.reduce((s,r)=>s+r[2],0);
  let gi=0;RCUT.forEach((c,i)=>{if(total>=c)gi=i});
  return{rows,total:Math.round(total),grade:RGRADES[gi],gi};
}

  draw('');
  document.getElementById('q').oninput=e=>draw(e.target.value.trim());
  document.getElementById('roster').onclick=e=>{const b=e.target.closest('button');if(b)profileSheet(b.dataset.id,true)};
  document.getElementById('rand').onclick=()=>start(pick(PROF).id);
}
function profileCard(p){
  const tr=traitsText(p),rel=relText(p);
  return `<div class="prof">
    <div class="prof-h"><h3>${esc(p.n)}</h3><span class="pw">전투력 ${'●'.repeat(p.pow)}${'○'.repeat(5-p.pow)}</span></div>
    <p>${esc(p.d)}</p>
    <dl class="kit"><div><dt>무기</dt><dd>${esc(p.w)}</dd></div><div><dt>역할</dt><dd>${esc(ROLE[p.role].n)}</dd></div><div><dt>스킬</dt><dd>「${esc(p.sk.n)}」 <span class="muted">${esc(SKT[p.sk.t])}</span></dd></div><div><dt>시작 숙련도</dt><dd>${MG[p.m0]}</dd></div></dl>
    <p class="muted">${esc(ROLE[p.role].perk)}</p>
    <div class="meters">${[['선공',p.agg],['동맹',p.ally],['배신',p.bt]].map(([k,v])=>`<div><span>${k}</span><div class="bar"><i style="width:${v*100}%"></i></div></div>`).join('')}</div>
    <ul class="beh">${tr.map(x=>`<li>${esc(x)}</li>`).join('')}<li>${esc(p.haunt.join(', '))}에 자주 나온다</li><li>${esc(IDLE[p.idle])}</li>${rel.map(x=>`<li class="rel">${esc(x)}</li>`).join('')}</ul>
  </div>`;
}
function profileSheet(id,canStart){
  const p=BY[id];
  openSheet(`${profileCard(p)}${canStart?`<button class="btn-main" id="go">${esc(J(p.n,'으로'))} 참가</button>`:''}`);
  if(canStart)document.getElementById('go').onclick=()=>{closeSheet();start(id)};
}
function openSheet(html,tabs){
  const s=document.getElementById('sheet');
  s.innerHTML=`<div class="scrim" id="scrim"></div><div class="panel" role="dialog" aria-modal="true">${tabs||''}<button class="x" id="sx" aria-label="닫기">닫기</button><div class="pbody" id="pbody">${html}</div></div>`;
  document.getElementById('scrim').onclick=closeSheet;document.getElementById('sx').onclick=closeSheet;
}
function closeSheet(){const s=document.getElementById('sheet');if(s)s.innerHTML=''}

/* ---------- game ---------- */
function start(pid){
  curPid=pid;initRun(pid);
  app.innerHTML=`<header class="top"><div class="wrap hudwrap" id="hud"></div></header>
  <main class="wrap game" id="stage"></main>
  <nav class="dock"><div class="in">
    <button data-s="bag">가방</button><button data-s="map">지도</button><button data-s="who">생존자</button><button data-s="log">기록</button><button data-s="dex">도감</button>
  </div></nav><div id="sheet"></div>`;
  document.querySelector('.dock').onclick=e=>{const b=e.target.closest('button');if(b)infoSheet(b.dataset.s)};
  render();scrollTo(0,0);
}
function hud(){
  const m=G.me,al=allies(),tot=alive().length+1;
  const zone=G.zones.has(m.area)?`<span class="badge red">금지구역 ${m.zt}턴</span>`:G.next.includes(m.area)?'<span class="badge amber">곧 금지</span>':'';
  const bar=(l,v,mx,c,low)=>`<div><span>${l} ${Math.max(0,Math.round(v))}</span><div class="bar"><i style="width:${pct(v,mx)}%;background:${v<low?'var(--red)':c}"></i></div></div>`;
  document.getElementById('hud').innerHTML=`
  <div class="h1"><b class="ph">${phaseName(G.phase)}${G.phase>=FINAL?' · 최종':''}</b><span class="sp"></span><span>선택 <b>${G.choices}</b></span><span>생존 <b>${tot}</b>/24</span></div>
  <div class="h2"><span class="me">${esc(m.p.n)}</span><span class="loc">${esc(m.area)}</span>${zone}${m.bleed?'<span class="badge red">출혈</span>':''}${m.berserk?'<span class="badge red">광폭화</span>':''}</div>
  <div class="bars">${bar('체력',m.hp,m.max,'var(--ok)',35)}${bar('정신',m.san,100,'var(--violet)',30)}${bar('포만',m.full,100,'var(--amber)',25)}</div>
  <div class="chips"><span class="chip">무기 <b class="g${m.wg}">${GR[m.wg]}</b></span><span class="chip">방어구 <b class="g${m.ag}">${GR[m.ag]}</b></span><span class="chip">${esc(m.p.w)} 숙련 <b>${MG[m.ml]}</b></span><span class="chip">처치 <b>${m.kills}</b></span>${al.map(a=>`<span class="chip ally">동맹 ${esc(nm(a))} <b>${Math.max(0,a.hp)}</b></span>`).join('')}</div>`;
}
const LINE_CLS={'crit-bad':'crit-bad','crit-good':'crit-good','crit-win':'crit-win',pick:'pick',news:'news',warn:'warn',bad:'bad',good:'good',phase:'phase',dead:'dead',win:'win'};
function render(){
  hud();
  const S=document.getElementById('stage');
  if(G.mode==='over'){S.innerHTML=endCard();bindEnd();scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}
  const c=G.card;
  const picked=G.mode==='result'?G.log.slice(G.cardMark).find(e=>e.c==='pick'):null;
  let h=`<article class="card ${c.cls||''}">
    <div class="ctag"><span>${esc(c.tag)}</span><span>${esc(G.me.area)} · ${phaseName(G.phase)}</span></div>
    <h2>${esc(c.title)}</h2>
    <div class="ctext">${esc(c.text).split('\n').map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(G.mode==='card'){
    h+=`<div class="olist">${c.opts.map((o,i)=>`<button data-i="${i}" class="opt ${o.dis?'dis':''} ${o.warn?'warn':''} ${o.urgent?'urgent':''}" ${o.dis?'aria-disabled="true"':''}><span class="l">${esc(o.l)}</span>${o.dis?`<span class="d req">${esc(o.req)}</span>`:o.urgent&&o.d?`<span class="d">${esc(o.d)}</span>`:''}</button>`).join('')}</div>`;
  }else{
    const lines=G.result.lines;
    h+=`<div class="chosen">▸ ${esc(picked?picked.t:'')}</div><div class="result">${lines.map(e=>`<p class="${LINE_CLS[e.c]||''}">${esc(e.t).replace(/\n/g,'<br>')}</p>`).join('')}</div>
    <button class="btn-main cont" id="cont">${G.over?'결과 보기':'계속'}</button>`;
  }
  h+='</article>';
  S.innerHTML=h;
  if(G.mode==='card')S.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=c.opts[+b.dataset.i];if(o.dis)return;pickOpt(o);render();const r=S.querySelector('.chosen');if(r){const y=r.getBoundingClientRect().top+scrollY-(document.querySelector('.top').offsetHeight+12);scrollTo({top:Math.max(0,y),behavior:RM()?'auto':'smooth'})}});
  else{const b=document.getElementById('cont');b.onclick=()=>{cont();render();scrollTo({top:0,behavior:RM()?'auto':'smooth'})};}
}

/* ---------- info sheets ---------- */
function infoSheet(k){
  const tabs=`<div class="tabs">${[['bag','가방'],['map','지도'],['who','생존자'],['log','기록'],['dex','도감']].map(([t,l])=>`<button data-t="${t}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>`;
  openSheet(sheetBody(k),tabs);
  document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)infoSheet(b.dataset.t)};
  const pb=document.getElementById('pbody');
  if(k==='dex')pb.onclick=e=>{const b=e.target.closest('[data-id]');if(b){const d=b.nextElementSibling;d.hidden=!d.hidden}};
  if(k==='bag')pb.onclick=e=>{const b=e.target.closest('[data-use]');if(b&&!G.over&&G.mode==='card'){useItem(b.dataset.use);hud();infoSheet('bag')}};
  if(k==='log')pb.scrollTop=pb.scrollHeight;
}
function sheetBody(k){
  const m=G.me;
  if(k==='bag'){
    const sp=Object.entries(m.sp).filter(([,v])=>v>0);
    const canUse=G.mode==='card'&&!G.over;
    const use=[['food','식량 먹기','포만감 +22',m.inv.food],['meal','음식 먹기','체력 +10 · 포만감 +35',m.it.meal],['bandage','붕대 감기','체력 +20 · 출혈 멈춤',m.it.bandage],['sedative','진정제 먹기','정신 +18',m.it.sedative]];
    return `<h4>바로 쓰기${canUse?'':' · 장면을 넘긴 뒤 쓸 수 있다'}</h4><div class="use">${use.map(([k2,l,d,n])=>`<button data-use="${k2}" ${!n||!canUse?'disabled':''}><b>${l}</b><span>${d} · ${n}개</span></button>`).join('')}</div>
    <h4>재료</h4><div class="grid">${Object.entries(MATN).map(([key,l])=>`<div class="cell"><span>${l}</span><b>${m.inv[key]}</b></div>`).join('')}</div>
    <h4>덫</h4><p>${m.it.trap}개 · 교전 중이나 특정 장면에서 쓸 수 있다.</p>
    <h4>특수 재료</h4><p class="muted">${sp.length?sp.map(([s,v])=>`${esc(s)} ×${v}`).join(', '):'없음. 운석·생명의 나무는 방송된 지역에서, 미스릴·포스 코어·VF 혈액 샘플은 알파·오메가·위클라인에게서 얻는다.'}</p>
    <h4>제작법 · 작업대 장면에서 만든다</h4><ul class="rec">${recipes().map(r=>`<li class="${canPay(r)?'ok':''}"><b>${esc(r.l)}</b><span>${esc(costText(r))}</span></li>`).join('')}</ul>`;
  }
  if(k==='map'){
    return `<ul class="maplist">${AREAS.map(a=>{
      const t=[];if(a===m.area)t.push('<span class="badge cyan">현재 위치</span>');
      if(G.zones.has(a))t.push('<span class="badge red">금지구역</span>');else if(G.next.includes(a))t.push('<span class="badge amber">곧 금지</span>');
      if(G.specials[a])t.push(`<span class="badge gold">${esc(G.specials[a])}</span>`);if(G.drop===a)t.push('<span class="badge gold">보급 상자</span>');if(G.boss&&G.boss.area===a)t.push(`<span class="badge red">${esc(G.boss.name)}</span>`);
      if(G.ptraps[a])t.push(`<span class="badge">내 덫 ${G.ptraps[a]}</span>`);
      const seen=others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).map(nm);
      return `<li class="${a===m.area?'cur':''} ${G.zones.has(a)?'z':''}"><div><b>${esc(a)}</b>${t.join('')}</div><span class="muted">재료 ${AREA_MATS[a].map(x=>MATN[x]).join('·')}${seen.length?` · 목격 ${esc(seen.join(', '))}`:''}</span><span class="muted">연결: ${ADJ[a].map(esc).join(', ')}</span></li>`}).join('')}</ul>`;
  }
  if(k==='who'){
    const al=G.npcs.filter(n=>n.alive),dd=G.dead;
    return `<h4>생존 ${al.length+1}명</h4><ul class="who"><li><b>${esc(m.p.n)}</b><span>나</span></li>${al.map(n=>`<li><b>${esc(nm(n))}</b><span>${n.team==='me'?'동맹':n.seen?`마지막 목격 ${esc(n.seen.area)} · ${phaseName(n.seen.phase)}`:'위치 모름'}${n.hostile&&n.team!=='me'?' · 적대':''}</span></li>`).join('')}</ul>
    <h4>사망 ${dd.length}명</h4><ul class="who dead">${dd.map(d=>`<li><b>${esc(d.n)}</b><span>${esc(d.how)} · ${esc(d.when)}</span></li>`).join('')||'<li class="muted">아직 없음</li>'}</ul>`;
  }
  if(k==='log')return `<ol class="journal">${G.log.map(e=>`<li class="${LINE_CLS[e.c]||''}">${e.c==='pick'?'▸ ':''}${esc(e.t).replace(/\n/g,'<br>')}</li>`).join('')}</ol>`;
  if(k==='dex'){
    const list=[m.p,...G.npcs.map(n=>n.c)];
    return `<p class="muted">이번 실험 참가자 24명. 이름을 누르면 행동 양식이 펼쳐진다.</p><ul class="dex">${list.map(p=>`<li><button data-id="${p.id}"><b>${esc(p.n)}</b><span>${esc(traitsText(p).join(' · '))}</span></button><div hidden>${profileCard(p)}</div></li>`).join('')}</ul>`;
  }
  return '';
}

/* ---------- end ---------- */
function endTitle(){
  const o=G.over,m=G.me;
  if(o.kind==='isekai')return'이세계로 전생한 실험체';if(o.kind==='exit')return'로그아웃에 성공한 자';if(o.kind==='escaped')return'섬을 탈출한 자';if(o.win){if(m.berserk)return'광기의 우승자';if(m.betrayer>=2)return'배신으로 올라선 1위';if(m.kills>=8)return'피로 쓴 생존기';if(m.allyHist.length>=3)return'동맹을 모은 생존자';if(m.kills<=2)return'숨어서 살아남은 자';return'최후의 생존자'}
  return({kill:'교전 중 사망',zone:'금지구역에서 산화',beast:'야생에 삼켜짐',trap:'덫에 걸려 사망',mad:'정신이 무너짐',hunger:'굶주림',escape:'탈출 실패',bleed:'과다 출혈',gas:'가스 중독',quake:'깔림',storm:'폭풍',chicken:'닭에게 짐',truck:'트럭',isekai:'이세계 전생',meme:'어이없는 죽음',fall:'추락',poison:'식중독',bee:'벌떼',drone:'드론',heat:'사우나에서 잠듦',shock:'감전',drown:'익사',fire:'화재',meteor:'운석',vf:'VF 폭주',mimic:'미믹에게 먹힘'})[o.kind]||'탈락';
}
function endCard(){
  const o=G.over,m=G.me,S=scoreRun();
  return `<section class="end ${o.win?'w':''}">
    <div class="eyebrow">${o.win?'Experiment complete':'Subject terminated'}</div>
    <div class="et">${o.win?'1위':`${o.rank}위`} · ${esc(endTitle())}</div>
    <p class="muted">${esc(m.p.n)} · ${phaseName(o.phase)}</p>
    <p>${esc(o.text)}</p>
    <div class="score">
      <div class="grade g-${S.grade[0]}"><span>연구 등급</span><b>${S.grade}</b></div>
      <div class="pts"><span>실험 점수</span><b>${S.total.toLocaleString()}</b><small>아글라이아 평가 · 다음 등급까지 ${S.gi<RCUT.length-1?(RCUT[S.gi+1]-S.total).toLocaleString()+'점':'최고 등급'}</small></div>
    </div>
    <table class="breakdown"><tbody>${S.rows.map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td><td class="num">+${Math.round(r[2]).toLocaleString()}</td></tr>`).join('')}</tbody></table>
    <dl>
      <div><dt>선택</dt><dd>${G.choices}</dd></div><div><dt>처치</dt><dd>${m.kills}</dd></div>
      <div><dt>무기 / 방어구</dt><dd><span class="g${m.wg}">${GR[m.wg]}</span> / <span class="g${m.ag}">${GR[m.ag]}</span></dd></div>
      <div><dt>배신 당함 / 함</dt><dd>${m.betrayed} / ${m.betrayer}</dd></div>
    </dl>
    ${m.killed.length?`<p><span class="muted">처치한 실험체</span><br>${esc(m.killed.join(', '))}</p>`:''}
    ${m.allyHist.length?`<p><span class="muted">함께했던 동맹</span><br>${esc(m.allyHist.join(', '))}</p>`:''}
    <div class="acts"><button class="again" id="again">${esc(J(m.p.n,'으로'))} 다시</button><button id="pickagain">다른 실험체 선택</button></div>
    <button class="copy" id="cp">결과 복사</button><div class="copied" id="cpm"></div>
  </section>`;
}
function bindEnd(){
  document.getElementById('again').onclick=()=>start(curPid);
  document.getElementById('pickagain').onclick=()=>{selectScreen();scrollTo(0,0)};
  document.getElementById('cp').onclick=()=>{const o=G.over,m=G.me;const S=scoreRun();const txt=`[루미아 섬 생존 일지]\n${m.p.n} · ${o.win?'1위':o.rank+'위'} · ${endTitle()}\n연구 등급 ${S.grade} · ${S.total.toLocaleString()}점 · 히든 ${m.st.hidden.length}/${HIDDEN_TOTAL}\n${phaseName(o.phase)} · 선택 ${G.choices} · 처치 ${m.kills}\n${o.text}`;const el=document.getElementById('cpm');
    try{navigator.clipboard.writeText(txt).then(()=>el.textContent='복사했습니다.',()=>el.textContent=txt)}catch(e){el.textContent=txt}};
}
selectScreen();

</script>
</body>
</html>
