<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="이터널 리턴 실험체로 루미아 섬에서 살아남는 하드코어 텍스트 어드벤처 (팬메이드)">
<meta name="theme-color" content="#0b0f16">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>루미아 섬 생존 일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one scene card at a time, like a text adventure page. Sticky status band on top, Sticky status band on top, narrative log in one column, choices directly under the latest line, info tabs docked at the bottom. One dark look by choice. */
:root{
  --bg:#0b0f16;--panel:#121925;--panel2:#18212f;--line:#243145;
  --fg:#dce4ee;--dim:#8291a5;--cyan:#62d3e4;--amber:#ffb547;--red:#ff5a6e;--ok:#58c47a;--gold:#f2b233;--violet:#8f8cff;
  --g0:#a3acb7;--g1:#58c47a;--g2:#4a92ff;--g3:#b06bff;--g4:#f2b233;
  --display:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.muted{color:var(--dim)}
.g0{color:var(--g0)}.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}.g4{color:var(--g4)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);transition:width .3s}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.btn-main{background:var(--cyan);color:#06131a;border:0;border-radius:6px;padding:14px 18px;font-family:var(--display);font-size:21px;width:100%}
.btn-main:hover{filter:brightness(1.08)}
.badge{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:2px}
.badge.red{border-color:var(--red);color:var(--red)}.badge.amber{border-color:var(--amber);color:var(--amber)}.badge.cyan{border-color:var(--cyan);color:var(--cyan)}.badge.gold{border-color:var(--gold);color:var(--gold)}

/* select */
.sel{padding-block:40px 40px}
.hero{display:flex;flex-direction:column;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,60px);line-height:1.03;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{margin:0;color:var(--dim);max-width:36em}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:3}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.roster button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:100%}
.roster button:hover{border-color:var(--cyan)}
.roster b{font-family:var(--display);font-weight:400;font-size:19px}
.roster span{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* profile */
.prof{display:flex;flex-direction:column;gap:10px}
.prof-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prof h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.pw{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.1em}
.prof p{margin:0}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.kit dt{font-size:11.5px;color:var(--dim)}.kit dd{margin:0;font-size:14px}
.kit div:nth-child(3){grid-column:1/-1}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meters span{font-size:11.5px;color:var(--dim)}
.beh{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.beh .rel{color:var(--amber)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;background:var(--panel);border-top:1px solid var(--line);border-radius:12px 12px 0 0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel .x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--dim)}
.pbody{overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pbody h4{margin:6px 0 0;font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:12px 84px 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--dim)}
.tabs button.on{color:var(--fg);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:var(--panel2);border-radius:4px;padding:8px 10px;display:flex;justify-content:space-between}
.cell span{font-size:13px;color:var(--dim)}.cell b{font-family:var(--mono)}
.rec,.maplist,.who,.dex{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rec li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:6px}
.rec li.ok{color:var(--fg)}.rec li.ok b{color:var(--ok)}
.rec b{font-weight:500}
.maplist li{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.maplist li.cur{border-color:var(--cyan)}.maplist li.z{opacity:.6}
.maplist b{font-size:15px}
.who li{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.who li span{color:var(--dim);font-size:12.5px;text-align:right}
.who.dead b{color:var(--dim);text-decoration:line-through}
.dex button{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column}
.dex button span{font-size:12px;color:var(--dim)}
.dex li>div{padding:10px 4px 6px}

/* game */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hudwrap{padding-block:10px 10px;display:flex;flex-direction:column;gap:7px}
.h1{display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.h1 b{color:var(--fg);font-family:var(--mono)}
.h1 .ph{font-family:var(--display);font-weight:400;font-size:19px;color:var(--amber)}
.h1 .sp{flex:1}
.h2{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.h2 .me{font-family:var(--display);font-size:20px;margin-right:8px}
.h2 .loc{font-size:14px;color:var(--cyan)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bars span{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.bar.hp i{background:var(--ok)}.bar.san i{background:#8f8cff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.chip b{font-family:var(--mono);font-weight:600}
.chip.ally{border-color:var(--ok);color:var(--ok)}
.game{padding-block:14px 120px}
.card{display:flex;flex-direction:column;gap:12px}
.ctag{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--dim)}
.ctag span:first-child{color:var(--cyan);border:1px solid currentColor;border-radius:3px;padding:1px 7px;font-family:var(--body);letter-spacing:0}
.card.bad .ctag span:first-child{color:var(--red)}.card.warn .ctag span:first-child{color:var(--amber)}.card.good .ctag span:first-child{color:var(--ok)}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.1;margin:0;text-wrap:balance}
.card.bad h2{color:#ff8a98}
.ctext{border-left:2px solid var(--line);padding-left:14px;font-size:16px;line-height:1.75;max-width:36em}
.ctext p{margin:0 0 6px}
.chosen{color:var(--cyan);font-weight:700;padding-top:4px}
.result{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.result p{margin:0;font-size:14.5px}
.result p.news{font-size:12.5px;color:var(--dim)}.result p.warn{color:var(--amber)}.result p.bad{color:#ff8a98}.result p.good{color:#8fe0a8}
.result p.phase{font-family:var(--display);font-size:19px;color:var(--amber);padding-top:6px}
.result p.dead{color:var(--red);font-weight:700}.result p.win{color:var(--gold);font-weight:700}
.cont{margin-top:4px}
.result p.crit-bad,.result p.crit-good,.result p.crit-win,.journal .crit-bad,.journal .crit-good,.journal .crit-win{font-family:var(--display);font-size:18px;letter-spacing:.04em;padding-top:4px}
.result p.crit-bad,.journal .crit-bad{color:var(--red)}.result p.crit-good,.journal .crit-good{color:var(--ok)}.result p.crit-win,.journal .crit-win{color:var(--gold)}
.opt .d.req{color:var(--red)}
.use{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.use button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column}
.use button span{font-size:12px;color:var(--dim)}
.use button:disabled{opacity:.4;cursor:default}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.journal .pick{color:var(--cyan);padding-top:8px}.journal .news{color:var(--dim);font-size:12.5px}.journal .warn{color:var(--amber)}.journal .bad{color:#ff8a98}.journal .good{color:#8fe0a8}
.journal .phase{font-family:var(--display);font-size:18px;color:var(--amber);padding-top:12px}.journal .dead{color:var(--red)}.journal .win{color:var(--gold)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.e{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);font-size:14.5px;overflow-wrap:anywhere}
.e.pick{color:var(--cyan);font-size:13px;border:0;padding:10px 0 2px}
.e.pick span{margin-right:6px}
.e.news{font-size:13px;color:var(--dim);font-family:var(--body)}
.e.warn{color:var(--amber)}
.e.bad{color:#ff8a98}
.e.good{color:#8fe0a8}
.e.phase{font-family:var(--display);font-size:21px;color:var(--amber);text-align:center;padding:18px 0 8px;border-bottom:1px solid var(--amber)}
.e.dead{color:var(--red);font-weight:700}
.e.win{color:var(--gold);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;padding-top:14px;scroll-margin-top:160px}
.head{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:5px;padding:12px 14px;font-size:15px}
.head.bad{border-left-color:var(--red)}.head.warn{border-left-color:var(--amber)}.head.good{border-left-color:var(--ok)}
.olist{display:grid;grid-template-columns:1fr;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt:hover{border-color:var(--cyan)}
.opt .l{font-weight:700;font-size:14.5px}
.opt .d{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.opt.hot{border-color:var(--gold)}.opt.hot .l{color:var(--gold)}
.opt.urgent{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel2));grid-column:1/-1}.opt.urgent .l{color:var(--red)}
.opt.warn .l{color:var(--red)}
.opt.dis{opacity:.4;cursor:default}
.opt.back{background:none;grid-column:1/-1;align-items:center}
.fight{display:grid;gap:6px;background:color-mix(in srgb,var(--red) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 50%,var(--line));border-radius:6px;padding:10px 12px}
.ftitle{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--red)}
.fc{display:grid;grid-template-columns:minmax(0,1fr) auto 90px 34px;gap:8px;align-items:center;font-size:13.5px}
.fc span{font-size:11.5px}.fc em{font-style:normal;font-family:var(--mono);font-size:12px;text-align:right}
.fc.down{opacity:.4}.fc.friend span{color:var(--ok)}.fc.friend .bar i{background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.dock button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 0;font-size:13px}
.end{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.end.w{border-color:var(--gold)}
.end .et{font-family:var(--display);font-size:30px;line-height:1.1;color:var(--amber);text-wrap:balance}
.end.w .et{color:var(--gold)}
.end p{margin:0;font-size:14px}
.end dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.end dt{font-size:11.5px;color:var(--dim)}.end dd{margin:0;font-family:var(--mono);font-weight:600}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:8px 10px;border:2px solid currentColor;border-radius:8px}
.grade span{font-size:11px;letter-spacing:.08em;color:var(--dim)}
.grade b{font-family:var(--display);font-weight:400;font-size:48px;line-height:1}
.grade.g-D{color:var(--g0)}.grade.g-C{color:var(--g1)}.grade.g-B{color:var(--g2)}.grade.g-A{color:var(--g3)}.grade.g-S{color:var(--g4)}
.pts{display:flex;flex-direction:column;min-width:0}
.pts span{font-size:11.5px;color:var(--dim)}.pts b{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}.pts small{color:var(--dim);font-size:12px}
.breakdown{width:100%;border-collapse:collapse;font-size:13.5px}
.breakdown th{text-align:left;font-weight:500;color:var(--dim);padding:4px 0;width:34%}
.breakdown td{padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.breakdown td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;width:72px}
.card.hidden .ctag span:first-child{color:var(--gold)}.card.hidden h2{color:var(--gold)}.card.hidden .ctext{border-left-color:var(--gold)}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}.hero-acts .btn-main{flex:2;min-width:200px}
.btn-sub{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-weight:700}
.roster button.locked{opacity:.6;border-style:dashed}.roster button.hid{border-color:var(--gold)}.roster button.hid b{color:var(--gold)}
.kit .w{grid-column:1/-1}.kit dt{font-size:11.5px;color:var(--dim)}
.chip.skill{border-color:var(--cyan);color:var(--cyan)}.chip.hid{border-color:var(--gold);color:var(--gold)}
.opt.skill{border-color:color-mix(in srgb,var(--cyan) 60%,var(--line))}.opt.skill .l{color:var(--cyan)}
.opt.role{border-color:color-mix(in srgb,var(--violet) 60%,var(--line))}.opt.role .l{color:var(--violet)}
.gal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gal li{border:1px dashed var(--line);border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;font-size:13px;color:var(--dim)}
.gal li span{font-family:var(--mono);font-size:11px}.gal li.on{border-style:solid;border-color:var(--gold);color:var(--fg)}.gal li.on span{color:var(--gold)}
.endno{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.06em}
.etext{font-size:15.5px;line-height:1.7;border-left:2px solid var(--gold);padding-left:12px}
.mapwrap{display:flex;flex-direction:column;gap:8px}
.mapwrap svg{width:100%;max-width:520px;align-self:center;aspect-ratio:1/1;max-height:62vh;background:var(--bg);border-radius:8px}
.mapwrap .sea{fill:color-mix(in srgb,var(--cyan) 7%,var(--bg))}
.mapwrap .island{fill:color-mix(in srgb,var(--ok) 10%,var(--panel2));stroke:color-mix(in srgb,var(--ok) 30%,var(--line));stroke-width:.6}
.mapwrap .road{stroke:var(--line);stroke-width:.7;stroke-linecap:round}.mapwrap .road.closed{stroke-dasharray:1 1;opacity:.5}
.mapwrap .node circle{fill:var(--panel2);stroke:var(--dim);stroke-width:.5}
.mapwrap .node.z>circle:first-child{fill:color-mix(in srgb,var(--red) 55%,var(--panel2));stroke:var(--red)}
.mapwrap .node.nx>circle:first-child{stroke:var(--amber);stroke-width:.9}
.mapwrap .node.safe>circle:first-child{fill:color-mix(in srgb,var(--cyan) 45%,var(--panel2));stroke:var(--cyan);stroke-width:1}
.mapwrap .node.lab>circle:first-child{fill:#2a2f3a;stroke:var(--dim);stroke-dasharray:1 .6}
.mapwrap .node.labopen>circle:first-child{fill:color-mix(in srgb,var(--violet) 45%,var(--panel2));stroke:var(--violet)}
.mapwrap .node.cur>circle:first-child{fill:var(--cyan);stroke:var(--fg)}
.mapwrap .ring{fill:none!important;stroke:var(--cyan)!important;stroke-width:.5!important;opacity:.8}
.mapwrap .labzone{fill:color-mix(in srgb,var(--red) 22%,transparent);stroke:color-mix(in srgb,var(--red) 55%,var(--line));stroke-width:.5}
.mapwrap .lbl.dim{fill:var(--dim)}
.mapwrap .lock{fill:none;stroke:var(--fg);stroke-width:.35}
.mapwrap .lbl{font-size:3.1px;fill:var(--fg);text-anchor:middle;font-family:var(--body);paint-order:stroke;stroke:var(--bg);stroke-width:.8px}
.mapwrap .cnt{font-size:2.8px;fill:var(--amber);font-family:var(--mono);font-weight:700}
.mapwrap .mk.gold{fill:var(--gold)}.mapwrap .mk.red{fill:var(--red)}.mapwrap .mk.cyan{fill:var(--cyan)}.mapwrap .mk.done{fill:var(--dim)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--dim)}
.legend li{display:flex;align-items:center;gap:5px}.lg{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--dim);font-style:normal}

/* ===== NPC simulation ===== */
function npcStep(){
  const me=G.me;
  for(const n of shuffle(alive())){
    if(n.busy)continue;
    if(n.team==='me'){n.area=me.area;n.hp=Math.min(npcMax(n),n.hp+4);continue}
    if(n.team&&n.team!==n.c.id){const L=G.npcs.find(x=>x.c.id===n.team);if(L&&L.alive){n.area=L.area;n.hp=Math.min(npcMax(n),n.hp+3);continue}n.team=null}
    {const mx=npcMax(n);if(n.hp>=mx-8&&n.hp<mx)n.hp=mx;n.hp=Math.min(mx,n.hp+(n.c.idle==='heal'?4:2));}
    const gp={farm:.055,camp:.04,trap:.035,heal:.03,hunt:.035,stalk:.035,roam:.035}[n.c.idle];
    if(n.g<4&&ch(gp*(n.talent||1)))n.g++;
    const danger=G.zones.has(n.area)||(G.next.includes(n.area)&&G.tick>=TPP-3);
    const prevArea=n.area;
    if(G.phase>=FINAL&&!(n.labRush&&G.labOpen)){const D=distMap(G.finalArea||LAB);if(n.area!==(G.finalArea||LAB)){n.area=ADJ[n.area].filter(passable).reduce((b,a)=>(D[a]??99)<(D[b]??99)?a:b,n.area)}}
    else if(danger||ch(MOVEP[n.c.idle])||(n.labRush&&G.labOpen&&n.area!==LAB)){
      const to=wpick(ADJ[n.area],a=>{if(a===LAB&&!G.labOpen)return 0;if(G.zones.has(a))return .02;let w=1;if(n.labRush&&G.labOpen){const D=distMap(LAB);w*=(D[a]<(D[n.area]??9))?8:.5}if(n.c.haunt.includes(a))w*=4;if(G.next.includes(a))w*=.3;if(a===me.area&&(n.c.idle==='hunt'||n.c.idle==='stalk')&&G.phase>=2)w*=3;if(G.specials[a])w*=1.5;if(G.drop===a)w*=1.5;return w});
      if(to)n.area=to;
    }
    if(n.area!==prevArea){
      const mem=G.npcs.filter(x=>x.alive&&x.team===n.c.id&&x!==n);mem.forEach(x=>x.area=n.area);
      if(G.ptraps[n.area]&&ch(.45)){G.ptraps[n.area]--;const d=ri(35,60);n.hp-=d;log(`[덫] ${n.area}에 설치한 덫이 작동했다. ${J(nm(n),'이')} 걸렸다.`,'good');if(n.hp<=0){G.me.kills++;G.me.killed.push(nm(n));kill(n,`처치: ${G.me.p.n}의 덫 · ${n.area}`,'me')}}
    }
    if(!n.alive)continue;
    if(G.zones.has(n.area)&&ch(.35)){kill(n,`${n.area} 금지구역 탈출 실패`,null);continue}
    if(n.c.tags.includes('trapper')&&ch(.22))G.ntraps[n.area]=n.c.id;
    if(G.specials[n.area]&&ch(.3)){delete G.specials[n.area];n.g=Math.min(4,n.g+1)}
    if(G.drop===n.area&&ch(.35)){G.drop=null;n.g=Math.min(4,n.g+1)}
    if(G.boss&&G.boss.area===n.area&&n.c.agg>.45&&ch(.1)){
      if(ch(.45)){log(`[방송] ${G.boss.name} 처치 · ${nm(n)}`,'news');n.g=4;G.boss=null}
      else kill(n,`${G.boss.name}에게 당함 · ${n.area}`,null);
    }
    if(n.alive&&ch(.002+G.phase*.0007))kill(n,`${n.area}에서 ${night()?pick(['늑대','곰','변이체']):pick(['멧돼지','들개'])}에게 당함`,null);
  }
  // group interactions away from the player
  const byArea={};
  for(const n of alive()){if(n.team==='me'||n.area===me.area||n.busy)continue;(byArea[n.area]=byArea[n.area]||{});const k=n.team||n.c.id;(byArea[n.area][k]=byArea[n.area][k]||[]).push(n)}
  for(const a in byArea){
    const gs=Object.values(byArea[a]);
    if(gs.length<2)continue;
    const [A,B]=shuffle(gs);
    if(A.some(x=>B.some(y=>bonded(x.c,y.c)))&&A.length+B.length<=3){merge(A,B);continue}
    const hate=A.some(x=>B.some(y=>hatesP(x.c,y.c)));
    const f=Math.max(leader(A).c.agg,leader(B).c.agg)*.32*(.7+G.phase*.09)+(hate?.6:0)+(G.phase>=FINAL?.3:0);

  }
  // betrayal inside NPC teams late game
  if(G.phase>=4)for(const n of alive()){if(n.team&&n.team!=='me'&&ch(n.c.bt*.012)){const mates=G.npcs.filter(x=>x.alive&&x!==n&&x.team===n.team&&!bonded(x.c,n.c));if(mates.length){const v=pick(mates);n.team=null;kill(v,`처치: ${nm(n)} (동맹 배신) · ${n.area}`,nm(n));n.kills++;break}}}
}
function merge(A,B){const L=leader(A);[...A,...B].forEach(x=>x.team=L.c.id)}
const groupPow=g=>g.reduce((s,n)=>s+npcPow(n)*(.5+n.hp/200),0);

    if(ch(.72)){k.kills++;if(ch(.4))k.g=Math.min(4,k.g+1);kill(n,`처치: ${nm(k)} · ${n.area}`,nm(k))}
    else{n.hp=Math.max(8,n.hp-45);n.team=null;n.area=pick(ADJ[n.area].filter(a=>!G.zones.has(a)))||n.area}

}

  if(me.wg>=2&&ch(.008)){me.wg--;log(`무기에 금이 갔다. 등급이 ${GR[me.wg]}로 떨어졌다.`,'bad')}
  if(me.exposed>0){me.exposed--;if(ch(.5))pullNpc('아글라이아 드론이 당신의 위치를 방송했다. 누군가 오고 있다.')}

/* ---------- flow ---------- */
function pickOpt(o){
  if(o.dis||G.over||G.mode!=='card')return;
  const mark=G.log.length;
  G.choices++;log(o.l,'pick');
  G.me.stealthUsed=false;
  {const tag=G.card&&G.card.tag;const tw=typeof rollTwist==='function'?rollTwist(o,tag):{mode:'normal'};if(tw.mode==='normal')o.f();else applyTwist(tw,tag,o)}
  if(!G.over&&!G.fight&&!G.chain&&G.card&&!['교전','기습','방송','경고'].includes(G.card.tag)&&ch(.015+G.phase*.006)){
    const c=npcsAdj().concat(others().filter(n=>n.area===G.me.area)).filter(n=>!n.busy&&n.c.agg>=.5&&!bonded(n.c,G.me.p));
    if(c.length){const n=pick(c);log('그 순간, 등 뒤에서 발소리가 빠르게 다가왔다!','bad');chain(()=>ambushCard(n))}
  }
  if(!G.over&&!o.noTick)tick();
  G.result={lines:G.log.slice(mark+1)};
  G.mode='result';
}
function cont(){
  if(G.over){G.mode='over';return}
  let c=null;
  if(G.chain){const f=G.chain;G.chain=null;c=f()}
  while(!c&&G.queue.length)c=G.queue.shift()();
  if(!c&&!G.over&&!others().length){c=finalCard()}
  if(G.over){G.mode='over';return}
  if(!c)c=drawCard();
  if(G.zones.has(G.me.area)&&!c.fight&&c.tag!=='경고'){c={...c,opts:[...bestMoves().slice(0,2).map(m=>({l:`금지구역 탈출: ${J(m.a,'으로')}`,d:`남은 시간 ${G.me.zt}턴`,urgent:1,f:()=>move(m.a)})),...c.opts]}}
  G.card=c;G.mode='card';G.result=null;G.cardMark=G.log.length;
}

/* ---------- card draw ---------- */
function drawCard(){
  const me=G.me,a=me.area;
  if(G.zones.has(a))return zoneCard();
  if(G.phase>=FINAL&&a!==LAB)return travelCard(true);
  const C=[];const add=(w,f)=>{if(w>0)C.push([w,f])};
  const gs=groupsAt(a);
  if(gs.length>=2)add(G.phase>=FINAL?12:4,()=>witnessCard(gs[0],gs[1]));
  if(gs.length)add(G.phase>=FINAL?30:7,()=>npcCard(gs[0]));
  if(npcsAdj().some(n=>n.c.idle==='stalk'))add(1.2,()=>stalkerCard());
  {const amb=npcsAdj().concat(others().filter(n=>n.area===a)).filter(n=>!n.busy&&n.c.agg>=.45&&!bonded(n.c,me.p));if(amb.length)add(.15+G.phase*.1+(night()?.3:0)+(me.hp<50?.15:0),()=>ambushCard(pick(amb)))}
  add(1.4+me.moved*.9+(G.next.includes(a)?6:0),()=>travelCard());
  if(G.drop===a)add(8,()=>dropCard());
  if(G.specials[a])add(8,()=>specialCard());
  if(G.boss&&G.boss.area===a)add(6,()=>bossCard());
  {const rc=recipes().filter(canPay);if(rc.length)add(rc.some(r=>/강화|방어구/.test(r.l))?8:1.8,()=>benchCard())}
  if(me.full<40)add(me.full<20?6:2.5,()=>hungerCard());
  if(me.hp<70)add(me.hp<40?6:3.5,()=>restCard());
  if(WILD.has(a)||night())add(night()?2.2:1.4,()=>beastCard());
  add(G.ntraps[a]?4:.7,()=>trapCard());
  if(allies().length)add(1.6,()=>allyCard());
  if(me.san<35)add(2.6,()=>hallucinationCard());else if(night()&&me.san<60)add(.5,()=>hallucinationCard());
  for(const s of SCENES){if(!s.c||s.c(a)){const seen=G.seenScenes[s.id+a]||0;const nd=s.need==='food'?(me.full<30?3:me.full<55?1.8:.7):s.need==='hp'?(me.hp<me.max*.35?3:me.hp<me.max*.65?1.8:.6):1;add(s.w*nd*(seen?.35:1),()=>{G.seenScenes[s.id+a]=seen+1;return s.make(a)})}}
  for(let i=0;i<6;i++){const f=wpick(C,x=>x[0]);const c=f[1]();if(c)return c}
  return travelCard();
}

/* ---------- moves & small actions ---------- */
function move(a){
  const me=G.me;if(G.zones.has(a)&&!G.zones.has(me.area))me.zt=Math.max(me.zt,2);me.area=a;me.moved=0;allies().forEach(x=>x.area=a);
  log(`${J(a,'으로')} 이동했다.${G.zones.has(a)?' 이곳은 금지구역이다!':''}`);
  if(G.ntraps[a]&&!me.scouted.has(a)&&ch(.45)){
    const o=BY[G.ntraps[a]];delete G.ntraps[a];const d=ri(16,30);san(-5);
    if(hurt(d,'trap',`${o.n}의 덫을 밟고 쓰러졌다.`))return;
    log(`발밑에서 딸깍 소리가 났다. ${o.n}의 덫이다! (체력 -${d})`,'bad');
  }
}
function safeDist(a){const seen={[a]:0},q=[a];while(q.length){const x=q.shift();if(!G.zones.has(x))return seen[x];for(const y of ADJ[x])if(seen[y]==null){seen[y]=seen[x]+1;q.push(y)}}return 99}
function bestMoves(){
  const me=G.me;
  return ADJ[me.area].map(a=>{
    const tags=[];if(G.zones.has(a))tags.push('금지구역');else if(G.next.includes(a))tags.push('곧 금지');
    if(G.specials[a])tags.push(G.specials[a]);if(G.drop===a)tags.push('보급');if(G.boss&&G.boss.area===a)tags.push(G.boss.name);
    if(G.phase>=FINAL&&a===LAB)tags.push('안전');
    const seen=others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).map(nm);if(seen.length)tags.push('목격: '+seen.slice(0,2).join('·'));
    const score=-safeDist(a)*4+(G.zones.has(a)?-5:0)+(G.next.includes(a)?-2:0)+(G.specials[a]?3:0)+(G.drop===a?2:0)+(G.phase>=FINAL?-DIST[a]*5:0)+rnd()*1.5;
    return{a,tags,score};
  }).sort((x,y)=>y.score-x.score);
}
function openDrop(){const me=G.me;G.drop=null;const r=rnd();
  if(r<.4&&me.wg<3){me.wg++;log(`상자 안에 ${GR[me.wg]} 등급 무기 부품이 있었다.`,'good')}
  else if(r<.7&&me.ag<3){me.ag++;log(`상자 안에 ${GR[me.ag]} 등급 방어구가 있었다.`,'good')}
  else{me.it.bandage+=2;me.it.meal++;log('상자 안에 붕대 2개와 음식이 있었다.','good')}
}
function takeSpecial(){const me=G.me;const s=G.specials[me.area];delete G.specials[me.area];me.sp[s]=(me.sp[s]||0)+1;log(`${J(s,'을')} 손에 넣었다. 전설 등급 제작 재료다.`,'good')}
function setTrap(){G.me.it.trap--;G.ptraps[G.me.area]=(G.ptraps[G.me.area]||0)+1;log(`${G.me.area}에 덫을 숨겨 설치했다.`)}
function useItem(k){const me=G.me;if(!me.it[k]&&k!=='food')return;
  if(k==='food'){if(!me.inv.food)return;me.inv.food--;full(22);log('식량을 먹었다. (포만감 +22)');return}
  me.it[k]--;
  if(k==='bandage'){heal(20);me.bleed=false;log('붕대를 감았다. 피가 멎었다. (체력 +20)')}
  if(k==='meal'){heal(10);full(35);san(3);log('음식을 먹었다. (체력 +10, 포만감 +35)')}
  if(k==='sedative'){san(18);log('진정제를 삼켰다. 손 떨림이 조금 멎었다. (정신 +18)')}
}

/* ---------- subjects ---------- */
function groupsAt(area){const m={};for(const n of alive()){if(n.area!==area||n.team==='me'||n.busy)continue;const k=n.team||n.c.id;(m[k]=m[k]||[]).push(n)}return Object.values(m)}
function joinMe(g){g.forEach(n=>{n.team='me';n.area=G.me.area;n.hostile=false;if(!G.me.allyHist.includes(nm(n)))G.me.allyHist.push(nm(n))});log(`${J(names(g),'과')} 동맹을 맺었다.`,'good')}
function canJoin(g){return allies().length+g.length<=2}
function stanceOf(g){
  if(G.me.hp<45&&ch(.08))return'attack';
  const me=G.me,L=leader(g),c=L.c,P=me.p;
  if(g.some(n=>n.vendetta===P.n))return'vendetta';
  if(g.some(n=>bonded(n.c,P)))return'bond';
  if(g.some(n=>hatesP(n.c,P)))return'hate';
  if(me.ambush)return'mine';
  if(me.berserk)return ch(.5)?'flee':'attack';
  if(g.some(n=>n.hostile))return'attack';
  if(G.phase>=FINAL)return ch(.75)?'attack':'standoff';
  if(ch(c.agg*(.05+G.phase*.05)+(me.hp<40?.06:0)))return'attack';
  if(canJoin(g)&&ch(c.ally*(1-G.phase*.07)))return'offer';
  if(c.idle==='heal'&&me.hp<65&&ch(.6))return'heal';
  if(['camp','farm','trap'].includes(c.idle)&&ch(.7))return c.idle;
  return'standoff';
}
const powLabel=g=>{const r=myPow()+allies().length*12-g.reduce((s,n)=>s+npcPow(n)*(.5+n.hp/200),0)-(g.length-1)*8;return r>12?'상대가 약해 보인다':r>-6?'비등해 보인다':'상대가 훨씬 강해 보인다'};
const ATK_T=[n=>`${J(n,'이')} 망설임 없이 달려들었다.`,n=>`풀숲에서 ${J(n,'이')} 튀어나왔다. 먼저 손을 쓴 쪽은 상대였다.`,n=>`${J(n,'이')} 웃으며 무기를 들었다. 대화할 생각은 없어 보인다.`,n=>`등 뒤에서 바람 소리가 났다. ${n}의 기습이다!`];

  const tagT={tag:'조우',title:N};

  if(st==='vendetta'){const v=g.find(n=>n.vendetta===me.p.n);if(v.abandoned)return atk(`${J(nm(v),'이')} 피투성이 얼굴로 나타났다. "날 버리고 혼자 도망쳐? 이 배신자 새끼야!"`);return atk(v.c.id==='seres'?`"아가씨를 해친 대가다." 세레스의 검이 먼저 날아왔다.`:`${J(nm(v),'이')} 이를 갈며 달려들었다. "네가 죽였지."`)}
  if(st==='hate'){const h=g.find(n=>hatesP(n.c,me.p));return atk(hateLine(h.c,me.p))}

  if(st==='bond'){const b=g.find(n=>bonded(n.c,me.p));return{...tagT,tag:'재회',cls:'good',text:bondLine(b.c,me.p),opts:[

    {l:'혼자 가겠다고 한다',f:()=>{log(`${J(nm(b),'은')} 잠시 말없이 서 있다가 붕대 하나를 건네고 물러났다.`);me.it.bandage++}}]}}
  if(st==='mine')return{...tagT,tag:'매복',text:`숨어 있던 자리 앞으로 ${J(N,'이')} 지나간다. 아직 눈치채지 못했다. ${look}`,opts:[

  if(st==='offer'){
    const line=c.bt>=.6?`${J(N,'이')} 활짝 웃으며 손을 내밀었다. "우리 같은 편 하자. 응?"`:`${J(N,'이')} 무기를 내리고 손을 내밀었다. "같이 움직이지 않을래?"`;

      {l:'거절한다',f:()=>{if(ch(c.agg*.5)){log(`"그럼 여기서 끝내지." ${J(N,'이')} 태도를 바꿨다.`,'bad');startFight(g,'foe')}else{log(`${J(N,'은')} 어깨를 으쓱하고 떠났다.`);g.forEach(n=>n.area=pick(ADJ[n.area]))}}},
      {l:'손을 잡는 척하다 찌른다',d:'선공 · 정신 -10',f:()=>{san(-10);me.betrayer++;log('내민 손을 잡아끌며 무기를 휘둘렀다.','bad');startFight(g,'me',[],1.5)}}]};
  }
  if(st==='heal')return{...tagT,tag:'치료',cls:'good',text:`${J(N,'이')} 다가와 상처를 살폈다. "많이 다쳤네요. 잠깐 봐 줄게요."`,opts:[

    {l:'거절하고 떠난다',f:()=>log('경계를 풀지 않았다.')},
    {l:'방심한 틈을 노린다',d:'선공 · 정신 -15',f:()=>{san(-15);me.betrayer++;startFight(g,'me',[],1.6)}}]};
  if(st==='camp')return{...tagT,tag:'거점',text:`${J(N,'이')} ${a} 2층에 자리를 잡았다. 창문 너머로 무기 끝이 보인다. 내려올 생각은 없어 보인다. ${look}`,opts:[

    {l:'우회해서 지나간다',f:()=>{log('거점을 피해 돌아갔다.');chain(()=>travelCard())}}]};
  if(st==='farm')return{...tagT,text:`${J(N,'이')} 정신없이 재료를 모으고 있다. 등이 무방비하다. ${look}`,opts:[
    {l:'기습한다',d:'선공',f:()=>startFight(g,'me')},
    {l:'말을 걸어 거래한다',f:()=>{if(ch(.65)){log(`서로 남는 재료를 바꿨다. (${gain({[pick(['metal','cloth','powder','herb'])]:2})})`);if(canJoin(g)&&ch(c.ally*.6))chain(()=>npcCard(g,'offer'))}else{log(`"내 거야." ${J(N,'이')} 무기를 들었다.`,'bad');startFight(g,'foe')}}},
    {l:'못 본 척 지나간다',f:()=>log('조용히 지나갔다.')}]};
  if(st==='trap')return{...tagT,text:`${J(N,'이')} 땅에 무언가를 묻고 있다. 덫이다. ${look}`,opts:[
    {l:'덮친다',d:'선공',f:()=>startFight(g,'me')},

  return{...tagT,text:`${J(N,'과')} 마주쳤다. 서로 무기를 쥔 채 거리를 잰다. ${look}`,opts:[

function propose(g){
  const me=G.me,L=leader(g),c=L.c;
  if(!canJoin(g)){log(`"동료가 너무 많잖아." ${J(names(g),'은')} 고개를 저었다.`);return}
  if(g.length>1&&!g.every(n=>n.c.ally>.4)){log(`${J(names(g),'은')} 이미 자기들끼리 팀이다. 끼워 줄 생각이 없다.`);return}
  const p=c.ally*.95-G.phase*.035+(me.p.role==='support'?.15:0)+(me.wg>=L.g?.1:0)+(L.spared?.35:0)-(me.berserk?.5:0);
  if(ch(p))joinMe(g);
  else if(ch(c.agg*.6)){log(`"순진하긴." ${J(names(g),'이')} 공격해 왔다.`,'bad');startFight(g,'foe')}
  else{log(`${J(names(g),'은')} 거절하고 자리를 떴다.`);g.forEach(n=>n.area=pick(ADJ[n.area]))}
}
function bondLine(c,P){

function hateLine(c,P){

  return{tag:'배신',title:nm(a),cls:'bad',text:`등 뒤에서 금속 소리. 돌아보니 ${J(nm(a),'이')} 무기를 치켜들고 있다. "미안. 마지막엔 한 명만 나가잖아."`,opts:[
    {l:'맞서 싸운다',f:()=>startFight([a],'foe',[],1.2)},
    {l:'설득한다',d:a.c.bt>=.6?'무모함':'해볼 만함',f:()=>{if(ch(.6-a.c.bt*.6)){a.team='me';a.hostile=false;G.me.betrayed--;log(`${J(nm(a),'이')} 무기를 내렸다. "…아직은 아니야."`,'good')}else{log('말이 끝나기도 전에 칼이 날아왔다.','bad');startFight([a],'foe',[],1.4)}}},

/* ---------- combat (card based) ---------- */
const foeName=f=>f.kind==='boss'?f.b.name:nm(f.n);

const foeMax=f=>f.kind==='boss'?f.b.max:npcMax(f.n);
const foeUp=f=>!f.gone&&(f.kind==='boss'?f.b.hp>0:f.n.alive);
const mLvlNpc=n=>Math.min(9,n.c.m0+Math.floor(G.phase*.4)+Math.floor(n.kills/3));
function gainXp(x){const m=G.me;if(m.ml>=9)return;m.xp+=x;let need=10+m.ml*6;while(m.ml<9&&m.xp>=need){m.xp-=need;m.ml++;log(`${m.p.w} 숙련도가 ${MG[m.ml]}로 올랐다.`,'good');need=10+m.ml*6}}
function atkOf(s){

  if(s.kind==='boss')return s.b.pow*.42;
  const n=s.n||s;return (13+n.g*6)*ROLE[n.c.role].atk*(1+mLvlNpc(n)*.07)*(.6+G.phase*.045)*(n.c.tags.includes('night')&&night()?1.15:1);
}
function dmgTo(t,raw){
  const v=.85+rnd()*.3;
  if(t==='me'){const m=G.me;return Math.max(2,Math.round(raw*(1-m.ag*.08)*ROLE[m.p.role].def*v))}
  if(t.kind==='boss')return Math.max(2,Math.round(raw*v));
  const n=t.n||t;return Math.max(2,Math.round(raw*(1-n.g*.05)*ROLE[n.c.role].def*v));
}
const myHit=f=>dmgTo(f,atkOf('me')*ctr(G.me.p.role,roleOf(f)));
const foeHit=(f,mult=1)=>dmgTo('me',atkOf(f)*mult*ctr(roleOf(f),G.me.p.role));
function startFight(foes,first,friends=[],mult=1){

  if(first==='foe'){for(const f of F.foes){const k=f.kind==='npc'&&f.n.c.role==='assassin'?1.2:.9;const d=foeHit(f,k*mult);if(hurt(d,'kill',`${foeName(f)}의 기습에 쓰러졌다.`))return endFightClean();log(`${foeName(f)}의 일격! (체력 -${d})`,'bad');break}}
  if(first==='me'){const t=F.foes[0];const d=Math.round(myHit(t)*(me.p.role==='assassin'?1.6:1.3)*mult);log(`먼저 파고들어 ${foeName(t)}에게 일격! (피해 ${d})`,'good');dmgFoe(t,d,'me')}

function fightCard(){

function dmgFoe(f,d,by){

function npcSkill(f,F){

function fightRound(act){

  F.foes.forEach(f=>{if(f.kind==='npc'&&foeUp(f))f.n.area=me.area});

  }
  for(const f of F.foes)if(foeUp(f)&&f.dot){log(`${foeName(f)}의 상처에서 피가 흐른다. (피해 ${f.dot})`);dmgFoe(f,f.dot,'me')}

function rollTwist(o,tag){
  if(!tag||TW_NONE.has(tag)||o.urgent||o.noTwist)return{mode:'normal'};
  const src=o.f.toString();
  const random=/\bch\(|rnd\(\)/.test(src);
  const flow=TW_FLOW.test(src);
  const cost=!!o.req||/inv\.\w+--|it\.\w+--|-=\d/.test(src);
  let luck=(hasP('lucky')?.06:0)+(G.me.fortune?.12:0)+(G.me.charm?.03:0)-(G.me.cursed?.03:0)+(G.me.san<30?-.04:0);
  if(G.me.bigLuck){G.me.bigLuck=false;luck+=.18}if(G.me.fortuneN>0){G.me.fortuneN--;luck+=.1}
  if(G.me.fortune){G.me.fortune=false}
  const r=rnd();
  const canSkip=TW_SKIP.has(tag)&&!random&&!flow&&!cost;
  const pBad=(random?.08:canSkip?.2:.12)-luck, pGood=(random?.08:.16)+luck, pJack=.025+luck/3;
  if(r<pBad){if(G.me.ward>0){G.me.ward--;log('불길한 예감이 스쳤지만 비켜 갔다.','good');return{mode:'normal'}}return{mode:canSkip?'fail':'bad'}}
  if(r<pBad+pJack)return{mode:'jackpot'};
  if(r<pBad+pJack+pGood)return{mode:'good'};
  return{mode:'normal'};
}
function applyTwist(t,tag,o){
  const grp=twGroup(tag);
  if(t.mode==='fail'){G.me.st.fail++;log('▼ 대실패','crit-bad');pick(FAIL[grp]||FAIL.explore)();return true}
  o.f();
  if(G.over||G.fight)return true;
  if(t.mode==='bad'){log('▼ 일이 꼬였다','crit-bad');pick(grp==='social'?FAIL.explore.slice(0,3):(FAIL[grp]||FAIL.explore))()}
  else if(t.mode==='good'){log('▲ 운이 따랐다','crit-good');pick(BONUS)()}
  else if(t.mode==='jackpot'){G.me.st.jack++;log('★ 대성공','crit-win');pick(JACKPOT)()}
  return true;
}

/* ---------- score ---------- */
const RGRADES=['D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+','S-','S','S+'];
const RCUT=[0,600,1000,1400,1800,2200,2600,3000,3400,3800,4300,4800,5400,6100,7000];
function scoreRun(){
  const o=G.over,m=G.me,st=m.st;
  const rank=o.win?1:o.rank;
  const rows=[
    ['순위',`${rank}위`,Math.max(0,(25-rank))*45+(o.win?600:0)+(o.kind==='escaped'?900:0)],
    ['생존 시간',phaseName(o.phase),(o.phase+1)*80],
    ['처치',`${m.kills}명`,m.kills*140],
    ['보스 처치',`${st.boss}회`,st.boss*300],
    ['장비',`${GR[m.wg]} / ${GR[m.ag]}`,(m.wg+m.ag)*70],
    ['숙련도',MG[m.ml],m.ml*60],
    ['사냥',`${st.hunt}회`,st.hunt*25],
    ['동맹',`${m.allyHist.length}명`,m.allyHist.length*40],
    ['살려 보냄',`${st.spare}회`,st.spare*60],
    ['배신',`${m.betrayer}회 함 · ${m.betrayed}회 당함`,m.betrayer*50+m.betrayed*40],
    ['대성공',`${st.jack}회`,st.jack*90],
    ['히든 발견',`${st.hidden.length}/${HIDDEN_TOTAL}`,st.hidden.length*350],
    ['선택',`${G.choices}회`,G.choices*4],
  ];
  if(typeof getEnding==='function'){const E=getEnding();rows.push(['엔딩',`#${String(E.no).padStart(2,'0')} ${E.title}`,E.no>=11&&E.no<=31?400:E.no<=10?100:0])}
  const total=rows.reduce((s,r)=>s+r[2],0);
  let gi=0;RCUT.forEach((c,i)=>{if(total>=c)gi=i});
  return{rows,total:Math.round(total),grade:RGRADES[gi],gi};
}

const RQ={'금속':['inv','metal'],'천':['inv','cloth'],'약초':['inv','herb'],'화약':['inv','powder'],'식량':['inv','food'],'가죽':['inv','leather'],'붕대':['it','bandage'],'음식':['it','meal'],'진정제':['it','sedative'],'덫':['it','trap']};
function reqCheck(t,fb){const m=G.me;const has=(nm,n)=>{const r=RQ[nm];return r?(m[r[0]][r[1]]||0)>=n:null};
  let mm=t.match(/^(\S+?)이나 (\S+) (\d+) 필요/);if(mm){const a=has(mm[1],+mm[3]),b=has(mm[2],+mm[3]);if(a!==null||b!==null)return!!(a||b)}
  mm=t.match(/^(\S+) (\d+)( 이상)? 필요/);if(mm){const r=has(mm[1],+mm[2]);if(r!==null)return r}
  if(/고급 이상 무기/.test(t))return m.wg>=1;
  if(t==='재료 필요')return Object.values(m.inv).some(v=>v>=1);
  return fb}
function optEnabled(o){if(o.reqText)return reqCheck(o.reqText,!o.dis);return!o.dis}
function clampInv(){const m=G.me;for(const k in m.inv)m.inv[k]=Math.max(0,m.inv[k]|0);for(const k in m.it)m.it[k]=Math.max(0,m.it[k]|0)}
function weaponWatch(){const m=G.me;if(m.wg!==m._wg){log(`${m.wg>m._wg?'무기 교체':'무기 손상'}: [${GR[m.wg]}] ${myWname()}`,m.wg>m._wg?'good':'bad');m._wg=m.wg}}
function echionSync(){const m=G.me;if(m.p.id!=='echion')return;const t=echionTarget(m.ml);

  else if(m.wg<t){if(t>=2&&!m.vfBranch){if(!m.vfAsk){m.vfAsk=1;queue(()=>vfBranchCard())}m.wg=Math.min(t,1)}else{m.wg=t;log(`VF 의수가 진화했다: ${myWname()}`,'crit-win')}m._wg=m.wg}}
function vfBranchCard(){const m=G.me;return{tag:'진화',title:'VF 의수 각성',cls:'hidden',text:'의수 안쪽에서 무언가 꿈틀거린다. 숙련도가 임계치를 넘었다. 의수가 어떤 형태로 진화할지, 몸이 선택을 요구한다.',opts:Object.entries(VF_BR).map(([k,b])=>({l:b.n,noTwist:1,f:()=>{m.vfBranch=k;m.wg=echionTarget(m.ml);m._wg=m.wg;log(`의수가 ${J(myWname(),'으로')} 진화했다. ${b.d}.`,'crit-win')}}))}}
function postAction(){clampInv();echionSync();weaponWatch();const m=G.me;if(m.film>=100&&!m.filmDone){m.filmDone=true;log('촬영 완료. 특종이 손에 들어왔다. 이제 아무것도 두렵지 않다. (피해 +45%)','crit-win')}}
function pickOpt(o){

    const c=npcsAdj().concat(others().filter(n=>n.area===G.me.area)).filter(n=>!n.busy&&n.c.agg>=.5&&!bonded(n.c,G.me.p)&&(n.aff||0)<30);
    if(c.length){const n=pick(c);log('그 순간, 등 뒤에서 발소리가 빠르게 다가왔다!','bad');chain(()=>ambushCard(n))}
  }

function cont(){

}

  if(c.group&&!c.fight&&ENC_TAGS.has(c.tag)){const ro=roleEncounterOpt(c.group,c.tag);if(ro)c.opts.push(ro);if(!c.opts.some(o=>/도망|달아난|물러난|빠져나/.test(o.l)))c.opts.push({l:'도망친다',noTwist:1,f:()=>fleeFrom(c.group)})}
  if(FIELD_OK.has(c.tag)&&!c.fight){
    const a=me.p.act;if(a)c.opts.push(me.fcd>0?{l:`[스킬] 「${a.n}」`,skill:1,dis:true,req:`재사용까지 ${me.fcd}턴`,f:()=>{}}:{l:`[스킬] 「${a.n}」`,skill:1,noTwist:1,noTick:1,f:()=>{const b=G.baseCard,ar=me.area;useField();if(b&&!G.over&&!G.fight&&!G.chain&&me.area===ar&&!b.fight)chain(()=>b)}});

/* ---------- movement ---------- */
function move(a){

  if(G.zones.has(a)&&!G.zones.has(me.area))me.zt=Math.max(me.zt,2);me.area=a;me.moved=0;allies().forEach(x=>x.area=a);

  if(G.ntraps[a]&&!me.scouted.has(a)&&me.trapImm!==G.phase&&ch(.45)){const o=BY[G.ntraps[a]];delete G.ntraps[a];const d=ri(16,30);san(-5);if(hurt(d,'trap',`${o.n}의 덫을 밟고 쓰러졌다.`))return;log(`발밑에서 딸깍 소리가 났다. ${o.n}의 덫이다! (체력 -${d})`,'bad')}

function bestMoves(){
  const me=G.me;const D=G.finalArea?distMap(G.finalArea):null;
  return ADJ[me.area].filter(passable).map(a=>{
    const tags=[];if(G.zones.has(a))tags.push('금지구역');else if(G.next.includes(a))tags.push('곧 금지');
    if(G.specials[a])tags.push(G.specials[a]);if(G.drop===a)tags.push('보급');if(G.boss&&G.boss.area===a)tags.push(G.boss.name);
    if(G.finalArea===a)tags.push('안전지대');if(me.p.id==='jp'&&G.nodesKnown&&G.nodes.includes(a)&&!G.hacked.has(a))tags.push('보안 노드');if(a===LAB)tags.push('연구소');
    const seen=others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).map(nm);if(seen.length)tags.push('목격: '+seen.slice(0,2).join('·'));

}
function jpPull(a){const me=G.me;const D=distMap(LAB);const d=D[a]??9;if(G.labOpen&&me.code)return -d*6;if(!G.labOpen&&me.code&&G.phase>=6)return -d*4;if(G.nodesKnown){const left=G.nodes.filter(x=>!G.hacked.has(x));if(left.length){const best=Math.min(...left.map(x=>distMap(x)[a]??9));return -best*2}}return 0}

function announceNext(first){

/* ---------- social ---------- */
function joinMe(g){g.forEach(n=>{n.team='me';n.area=G.me.area;n.hostile=false;n.wasAlly=true;n.abandoned=false;aff(n,10);G.me.allyIds.add(n.c.id);if(!G.me.allyHist.includes(nm(n)))G.me.allyHist.push(nm(n))});log(`${J(names(g),'과')} 동맹을 맺었다. 동료가 생기면 식량도 나눠야 한다.`,'good')}
function stanceOf(g){
  const me=G.me,L=leader(g),c=L.c,P=me.p,A=L.aff||0;
  if(g.some(n=>n.vendetta===P.n))return'vendetta';
  if(g.some(n=>bonded(n.c,P)))return'bond';
  if(g.some(n=>hatesP(n.c,P)))return'hate';
  if(me.trickNext){me.trickNext=false;return canJoin(g)?'offer':'standoff'}
  if(me.turf>0&&me.turfArea===me.area&&!g.some(n=>n.vendetta===P.n)&&A>-60)return'standoff';
  if(me.ambush)return'mine';
  if(me.berserk)return ch(.5)?'flee':'attack';
  if(P.id==='jp'&&G.labOpen&&g.some(n=>n.labRush))return'attack';
  if(g.some(n=>n.hostile)&&A<30)return'attack';
  if(A<=-40&&ch(.7))return'attack';
  if(G.phase>=FINAL)return ch(.75-A/250)?'attack':'standoff';
  const boost=tierName(L)==='괴물'?.15:0;
  if(ch(Math.max(0,c.agg*(.06+G.phase*.055)+(me.hp<40?.1:0)+boost-A/220)))return'attack';
  if(canJoin(g)&&ch(Math.max(0,c.ally*(.8-G.phase*.07)+A/180)))return'offer';
  if(c.idle==='heal'&&me.hp<65&&ch(.6))return'heal';
  if(['camp','farm','trap'].includes(c.idle)&&ch(.7))return c.idle;
  return'standoff';
}
function propose(g){
  const me=G.me,L=leader(g),c=L.c;
  if(!canJoin(g)){log(`"동료가 너무 많잖아." ${J(names(g),'은')} 고개를 저었다.`);return}
  if(g.length>1&&!g.every(n=>n.c.ally>.4)){log(`${J(names(g),'은')} 이미 자기들끼리 팀이다. 끼워 줄 생각이 없다.`);return}
  const p=c.ally*.8-G.phase*.045+(L.aff||0)/150+(me.p.role==='support'?.12:0)+(me.wg>=L.g?.08:0)+(L.spared?.3:0)-(me.berserk?.5:0)-allies().length*.15;
  if(ch(p))joinMe(g);
  else if(ch(c.agg*.6)){aff(L,-6);log(`"순진하긴." ${J(names(g),'이')} 공격해 왔다.`,'bad');startFight(g,'foe')}
  else{aff(L,-3);log(`${J(names(g),'은')} 거절하고 자리를 떴다.`);g.forEach(n=>n.area=pick(ADJ[n.area].filter(passable)))}
}
function npcCard(g,force){

    if(f.kind==='boss'&&f.b.isMage&&ch(.3)){k=1.6;log('미스터 메이지의 손에서 푸른 번개가 쏟아진다!','bad')}
    const fs=F.friends.filter(x=>x.alive);

    const ng=nfGuard(F,f,F.round<=1);if(ng===0)continue;

    if(counterP&&ch(counterP)){const cd=Math.round(d*.5)+3;log(`받아치기! ${foeName(f)}에게 피해 ${cd}`,'good');dmgFoe(f,cd,'me')}
  }

  for(const fr of F.friends){

function nfGuard(F,f,first){const N=F.nf||{};let k=1;
  if(N.block>0){N.block--;log(`니나가 ${foeName(f)}의 공격을 막아 냈다.`,'good');return 0}

  if(N.guardHits>0){N.guardHits--;k*=N.guardMul||.7}

/* ===================== V2 · DRAW, BREAKDOWN, BARTER, STORY, ENDINGS ===================== */
function drawCard(){
  const me=G.me,a=me.area;
  if(G.zones.has(a))return zoneCard();
  if(G.phase>=FINAL&&G.finalArea&&a!==G.finalArea&&a!==LAB)return travelCard(true);
  const C=[];const add=(w,f)=>{if(w>0)C.push([w,f])};
  if(a===LAB&&G.labOpen){
    add(me.code?9:2,()=>centralPcCard());
    if(G.mage)add(1.6*(hasP('hacker')?.7:1),()=>mageCard());
    const gs=groupsAt(a);if(gs.length)add(6,()=>npcCard(gs[0],'attack'));
    add(1.2,()=>travelCard());
    if(me.san<40)add(2,()=>breakdownCard());
    for(const s of SCENES)if(s.c&&!s.hidden&&s.c(a))add(s.w*.6,()=>s.make(a));
    for(let i=0;i<5;i++){const f=wpick(C,x=>x[0]);const c=f[1]();if(c)return c}
    return centralPcCard();
  }
  const enc=1+.35*allies().length;
  const gs=groupsAt(a);
  if(gs.length>=2)add((G.phase>=FINAL?12:4)*enc,()=>witnessCard(gs[0],gs[1]));
  if(gs.length)add((G.phase>=FINAL?30:7)*enc,()=>npcCard(gs[0]));
  if(npcsAdj().some(n=>n.c.idle==='stalk'))add(1.2,()=>stalkerCard());
  {const amb=npcsAdj().concat(others().filter(n=>n.area===a)).filter(n=>!n.busy&&n.c.agg>=.45&&!bonded(n.c,me.p)&&(n.aff||0)<30);if(amb.length)add(.7*(.15+G.phase*.1+(night()?.3:0)+(me.hp<50?.15:0))*enc*(hasP('stealth')?.5:1)*(me.noAmb===G.phase?0:1)*(hasP('hacker')?.7:1),()=>ambushCard(pick(amb)))}
  add(1.4+me.moved*.9+(G.next.includes(a)?6:0),()=>travelCard());
  if(G.drop===a)add(8,()=>dropCard());
  if(G.specials[a])add(8,()=>specialCard());
  if(G.boss&&G.boss.area===a)add(6,()=>bossCard());
  {const rc=recipes().filter(canPay);if(rc.length)add(rc.some(r=>/강화|방어구|암호/.test(r.l))?8:1.8,()=>benchCard())}
  if(me.full<40)add(me.full<20?6:2.5,()=>hungerCard());
  if(me.hp<70)add(me.hp<40?6:3.5,()=>restCard());
  if(WILD.has(a)||night())add(night()?2.2:1.4,()=>beastCard());
  add(G.ntraps[a]&&me.trapImm!==G.phase?4:.7*(me.trapImm===G.phase?0:1),()=>trapCard());
  if(allies().length)add(1.6,()=>allyCard());
  if(me.san<35)add(2,()=>hallucinationCard());else if(night()&&me.san<60)add(.5,()=>hallucinationCard());
  if(me.san<40)add((40-me.san)/6+1.5,()=>breakdownCard());
  if(barterPartners().length)add(1.3,()=>barterCard());
  if(storyDue())add(6,()=>storyCard());
  for(const s of SCENES){if(!s.c||s.c(a)){const seen=G.seenScenes[s.id+a]||0;const nd=s.need==='food'?(me.full<30?2.2:me.full<55?1.4:.6):s.need==='hp'?(me.hp<me.max*.35?3:me.hp<me.max*.65?1.8:.6):1;add(s.w*nd*(seen?.35:1),()=>{G.seenScenes[s.id+a]=seen+1;return s.make(a)})}}
  for(let i=0;i<6;i++){const f=wpick(C,x=>x[0]);const c=f[1]();if(c)return c}
  return travelCard();
}

function barterPartners(){return others().filter(n=>!n.busy&&!n.hostile&&(n.area===G.me.area||ADJ[G.me.area].includes(n.area))&&((n.aff||0)>=10||n.c.ally>=.6)&&(n.aff||0)>-10)}
const DEALS=[
 [{metal:1},{food:2}],[{cloth:2},{bandage:1}],[{food:2},{meal:1}],[{herb:2},{sedative:1}],[{powder:1,metal:1},{trap:1}],[{food:1},{herb:2}],[{leather:2},{metal:2}],[{metal:2},{bandage:1,food:1}],[{bandage:1},{food:2}],[{meal:1},{metal:2}],[{powder:2},{food:1,cloth:1}],[{cloth:1},{food:1}],

const hasItem=(k,v)=>((k in G.me.inv?G.me.inv[k]:G.me.it[k])||0)>=v;

    ...deals.map(([give,get])=>{const k0=Object.keys(give)[0];return{l:`${txt(give)} → ${txt(get)}`,reqText:`${ITN[k0]} ${give[k0]} 필요`,dis:!Object.entries(give).every(([k,v])=>hasItem(k,v)),f:()=>{

      Object.entries(get).forEach(([k,v])=>moveItem(k,v));aff(n,6);log(`거래 성립. (${txt(get)} 획득)`,'good');g.forEach(x=>x.area=pick(ADJ[x.area].filter(passable)))}}}),
    {l:'거절한다',f:()=>{aff(n,-2);log('"아쉽네." 발걸음이 멀어졌다.');g.forEach(x=>x.area=pick(ADJ[x.area].filter(passable)))}},
  ]};
}

 lucia:['유모가 읽어 주던 총사 이야기. 페란테가의 피비린내 나는 저녁 식탁 대신, 나는 동화 속으로 도망쳤다.','누군가 섬 벽에 그려 놓은 문장. 페란테가의 문장 위에 커다란 X가 그어져 있다.','동화의 마지막 장은 내가 쓴다. 해피엔딩이든, 아니든.'],
 aya:['피투성이 거실. 가족이 쓰러져 있던 그 밤. 범인의 얼굴은 끝내 보지 못했다.','현장 감식하듯 시체를 살폈다. 수법이 그날 밤과 똑같다. 그 살인마가 이 섬에 있다.','경찰 배지를 꺼내 본다. 이 섬에 법은 없다. 하지만 나는 아직 경찰이다.'],
 jackie:['처음으로 피를 봤던 날. 무서웠던가? 아니. 그날 밤 처음으로 살아 있다고 느꼈다.','누군가 내 사진을 들고 다닌다. 수배 전단이다. 경찰 냄새가 난다.','축제가 끝나 간다. 아쉽다. 이렇게 재밌는 곳은 다시 없을 텐데.'],
 estelle:['불길 속에서 나를 안아 들던 소방관의 등. 그 등을 보며 결심했다. 나도 누군가를 구하는 사람이 되겠다고.','타다 남은 건물. 불을 지른 사람이 있다. 웃으면서.','이 섬에서 한 명이라도 구할 수 있다면. 그게 나 자신이라도.'],
 blair:['VF 폭발. 무너진 건물 아래 아버지가 있었다. 그날 본 초인의 그림자를 잊지 않았다.','진통제가 더는 듣지 않는다. 그래도 장치가 반응한다. VF 반응. 이 섬에 괴물이 있다.','괴물을 잡으려면 괴물이 되어야 한다. 이미 늦었을지도 모른다.'],
 fenrir:['연구원이 들려주던 거대한 늑대 이야기. 신들이 사슬로 묶었지만, 늑대는 끝내 그 사슬을 끊었다.','손목의 장치가 사슬처럼 느껴진다. 끊을 수 있을까.','신을 삼킨 늑대처럼. 오늘 밤, 사슬을 끊는다.'],
 echion:['기억이 없다. 의수가 기억하는 건 싸움뿐이다. 그리고 누군가의 목소리. "살아."','실험 기록에 내 사진이 있다. 이름 칸은 비어 있다.','누가 살라고 했는지 기억나지 않는다. 그래도 산다.'],
 martina:['특종 하나면 모든 게 바뀐다고 믿었다. 그래서 왔다. 이 섬의 진실을 찍으러.','카메라에 찍힌 장면. 아글라이아 직원이 실험체의 시체를 기록하고 있다.','마지막 컷이 남았다. 살아서 내보내야 한다. 이 필름을.'],
 xiukai:['식당 문을 닫던 날. 마지막 손님에게 볶음밥을 내주며 웃었다. 그 손님이 아글라이아 직원이었다.','버려진 주방. 칼이 녹슬어 있다. 여기서도 요리를 할 수 있을까.','누군가에게 밥을 해 주는 게 내가 사는 방식이다. 마지막까지.'],
 mirka:['부모가 사라지던 날, 품에 안겨 울던 동생 마티아시. 그날부터 나는 보스가 됐다.','섬 벽에 아이 그림이 있다. 동생이 그리던 그림과 똑같다. 착각일 것이다.','동생이 기다린다. 나는 반드시 돌아간다.'],
 fiora:['아버지는 끝내 나를 인정하지 않았다. 레이피어를 쥔 손이 아직도 그 말을 기억한다.','약한 실험체가 괴물 같은 놈에게 쫓기고 있다. 기사는 약자를 지킨다. 그게 맹세였다.','아버지에게 보여 줄 수 없어도 좋다. 나는 기사다.'],
 jenny:['스크린 속의 나는 언제나 B급이었다. 주인공이 되고 싶었다. 한 번이라도.','손목 장치가 생중계 중이라는 소문. 그렇다면 지금 이 섬이 무대다.','엔딩 크레딧에 내 이름이 제일 위에 올라가는 장면을 상상한다.'],
 emma:['할아버지는 위대한 마술사였다. 유명해지면 할아버지가 나를 찾아올 거라고 믿었다.','마술 모자 안에 쪽지가 있다. 낯익은 필체다. "엠마, 도망쳐."','마지막 마술. 사라지는 건 내가 아니라 이 섬이다.'],
 hart:['밴드 동료들이 나를 버리고 떠났다. 그래도 음악이 세상을 바꾼다고 믿었다.','부서진 스피커에서 내 노래가 흘러나온다. 누군가 아직 듣고 있다.','마지막 공연. 관객이 단 한 명뿐이어도.'],
 cathy:['면허를 잃던 날. 나는 옳은 일을 했다고 지금도 생각한다.','쓰러진 실험체. 살릴 수 있다. 하지만 살리면 나를 죽일 수도 있다.','의사는 사람을 살린다. 이 섬에서도.'],
 isaac:['돈과 출세. 배지는 그걸 위한 도구였다. 손을 더럽히는 건 익숙하다.','괴도의 예고장이 또 왔다. 이번엔 반드시 잡는다.','이 섬에서 나가면 승진은 따 놓은 당상이다. 살아서 나간다면.'],
 laura:['보석보다 아름다운 건 사람들의 놀란 얼굴이었다. 그래서 훔쳤다.','부패 경찰의 냄새가 난다. 이 섬까지 쫓아왔나.','마지막 예고장. 이번에 훔칠 건 이 섬의 승리다.'],
 cliver:['수많은 손을 거쳐 왔다. 쥔 자는 모두 피를 불렀다. 그게 원념이 바라는 것이다.','섬 곳곳에서 피 냄새가 난다. 원념이 배를 채운다.','마지막 하나까지. 원념은 멈추지 않는다.'],
 eleven:['혼자 먹는 밥은 맛이 없었다. 그래서 카메라를 켰다. 화면 너머 누군가와 함께 먹으려고.','손목 장치에 시청자 수가 뜨는 것 같다. 착각이겠지.','누군가와 같이 밥 먹고 싶다. 이 섬을 나가면.'],
 bihyung:['가문이 숨겨 온 항아리. 뚜껑을 연 순간부터 나는 내 것이 아니게 됐다.','몸 안의 무언가가 이 섬을 좋아한다. 피 냄새를.','이 몸이 누구 것이든, 선택은 내가 한다.'],
 jp:['아글라이아 서버에 처음 침입한 날. 루미아라는 폴더를 열었다. 그리고 이 섬에 끌려왔다.','데이터 조각에 내 이름이 있다. "침입자 JP · 실험체 전환 완료."','시스템 안에서 끝낸다. 이 실험의 규칙을, 내 손으로.'],
};
const ARC_TH=[1,4,7];
function storyDue(){const s=G.me.arcStage;return s<3&&G.phase>=ARC_TH[s]}
function storyCard(){
  const me=G.me,p=me.p,s=me.arcStage;const T=ARC_TXT[p.id];
  const generic=[`문득 섬에 오기 전의 기억이 밀려온다. ${p.d}`,`아글라이아 서류철에서 ${p.n}의 이름을 발견했다. "적합도 양호. 정서적 결함이 관찰 가치 있음." 나를 이 섬에 보낸 이유가 거기 적혀 있다.`,'마지막 밤이 다가온다. 손목 장치의 숫자가 줄어든다. 무엇을 위해 여기까지 왔는지, 이제는 정해야 한다.'];
  const title=['기억','갈림길','결심'][s];
  const O=[
    [{l:'그 일을 칼날처럼 갈아 둔다',k:'r'},{l:'지키고 싶은 얼굴을 떠올린다',k:'s'},{l:'지난 일이다. 지금은 살아남는 것뿐',k:'n'}],
    [{l:'아글라이아를 반드시 무너뜨리겠다',k:'r'},{l:'이 섬에서 한 명이라도 더 살리겠다',k:'s'},{l:'이유 따윈 상관없다',k:'n'}],
    [{l:'끝까지 싸운다. 복수든 뭐든',k:'r'},{l:'누군가를 위해 살아서 나간다',k:'s'},{l:'아무것도 남기지 않는다',k:'n'}],
  ][s];
  return{tag:'스토리',title:`${p.n} · ${title}`,cls:'hidden',text:(T&&T[s])||generic[s],opts:O.map(o=>({l:o.l,noTwist:1,f:()=>{me.arc[o.k]++;me.arcStage++;
    if(o.k==='r'){san(-4);if(s===2)me.rageNext=true;log(s===2?'분노가 다음 싸움을 기다린다.':'가슴속에 무언가 단단해졌다.','warn')}
    if(o.k==='s'){san(6);if(s>=1)allies().forEach(a=>aff(a,15));if(s===2)heal(15);log('조금 따뜻해졌다.','good')}
    if(o.k==='n'){gainXp(5);if(s===2)san(15);log('마음이 차갑게 가라앉았다.')}
  }}))};
}
const domArc=()=>{const a=G.me.arc;const m=Math.max(a.r,a.s,a.n);if(m<2)return null;return a.r===m?'r':a.s===m?'s':'n'};

/* ---------- endings ---------- */
const ENDINGS={1:'최후의 생존자',2:'복수의 끝',3:'구원',4:'빈손의 승자',5:'피로 쓴 생존기',6:'그림자 속의 승자',7:'배신의 왕관',8:'마지막 동료',9:'칼을 거둔 손',10:'광기의 왕',11:'섬을 떠나는 배',12:'해킹 승리',13:'시스템 관리자',14:'로그아웃',15:'이세계 전생',16:'닭의 왕',17:'VF 적합자',18:'진실을 아는 자',19:'7차의 후계',20:'맹세를 지킨 검',21:'동화의 마지막 장',22:'정의 집행',23:'피의 축제',24:'불길 너머',25:'사냥의 끝',26:'사슬을 끊은 늑대',27:'완성된 병기',28:'특종',29:'섬의 요리사',30:'동생에게',31:'원념의 계승',32:'첫날의 희생자',33:'교전 중 사망',34:'믿었던 손',35:'버림받은 자의 복수',36:'금지구역',37:'굶주림',38:'과다 출혈',39:'덫',40:'야생의 먹이',41:'닭에게 짐',42:'무너진 정신',43:'미스터 메이지',44:'괴수의 먹이',45:'재난',46:'식중독',47:'어이없는 죽음',48:'2위',49:'탈출 실패',50:'문 앞에서',51:'VF 폭주',52:'이름 없는 실험체'};
const END_TXT={
 1:p=>`${J(p,'은')} 마지막까지 살아남았다. 이유는 묻지 않았다. 그저 살아남았다.`,
 2:p=>`복수는 끝났다. ${J(p,'은')} 섬을 나서며 한 번도 뒤돌아보지 않았다. 가슴은 생각보다 텅 비어 있었다.`,
 3:p=>`${J(p,'은')} 누군가를 지키고 싶었다. 그 마음 하나로 마지막 밤을 넘었다. 섬 밖의 햇빛이 따뜻했다.`,
 4:p=>`승리했지만 아무것도 남지 않았다. ${J(p,'은')} 텅 빈 눈으로 헬기에 올랐다.`,
 5:p=>`${p}의 손은 끝까지 피에 젖어 있었다. 아글라이아는 그 데이터에 높은 점수를 매겼다.`,
 6:p=>`거의 아무도 죽이지 않고 살아남았다. 그림자 속에서 기다리는 것도 실력이다.`,
 7:p=>`믿는 척, 손을 잡는 척. ${J(p,'은')} 배신으로 왕관을 썼다. 아무도 축하하지 않았다.`,
 8:p=>`마지막 동료가 금지구역으로 걸어 들어갔다. ${J(p,'은')} 그 이름을 평생 잊지 못할 것이다.`,
 9:p=>`수없이 칼을 거뒀다. 그 자비가 결국 ${J(p,'을')} 살렸다. 혹은 운이 좋았을 뿐이다.`,
 10:p=>`정신은 이미 무너졌다. 그래도 몸은 마지막까지 싸웠다. ${J(p,'은')} 웃으면서 우승했다.`,
 11:p=>`잠수정이 어둠 속으로 미끄러졌다. 아무도 이 실험의 1위를 기록하지 못했다.`,
 12:p=>`시스템 권한 획득. 섬 전체의 손목 장치가 동시에 붉게 빛났다. 승자는 규칙 밖에서 나왔다.`,
 13:p=>`미스터 메이지를 쓰러뜨리고 시스템을 장악했다. 연구소의 모든 기록이 이제 JP의 손에 있다.`,
 14:p=>`[게임 나가기]. 눈을 뜨니 내 방 침대였다. 진짜로.`,
 15:p=>`트럭이 다가왔고, 눈을 뜨니 낯선 하늘이었다. 상태창이 떠 있다. 이 섬보단 낫겠지.`,
 16:p=>`닭의 왕관을 쓴 채 우승했다. 섬의 닭들이 일제히 고개를 숙였다.`,
 17:p=>`나디아 박사의 주사가 몸 안에서 깨어났다. ${J(p,'은')} 우승했지만, 이제 사람이라고 부르기 어려웠다.`,
 18:p=>`진실을 알고도 살아남았다. ${J(p,'은')} 섬을 나서며 아글라이아 본사 주소를 외웠다.`,
 19:p=>`7차 생존자의 부품이 마지막 순간 ${J(p,'을')} 지켰다. 하수구 철창 너머로 누군가 손을 흔들었다.`,
 20:p=>`아가씨를 지키겠다는 맹세. 세레스는 끝내 그 약속을 지켰다. 부서진 검을 품에 안고 섬을 나섰다.`,
 21:p=>`세레스가 곁에 있었다. 동화의 마지막 장은 루치아가 직접 썼다. "그리고 둘은 오래오래…"`,
 22:p=>`그날 밤의 범인을 이 섬에서 찾았다. 아야는 경찰 배지를 꺼내 들었다. 정의는 늦게라도 도착했다.`,
 23:p=>`축제는 끝났다. 재키는 아쉬운 듯 피 묻은 칼을 닦았다. 다음 축제는 언제일까.`,
 24:p=>`불을 지르던 웃음소리가 멎었다. 에스텔은 불길 너머로 걸어 나왔다. 이번엔 자신을 구했다.`,
 25:p=>`VF 각성자를 쓰러뜨렸다. 블레어는 아버지에게 돌아간다. 괴물이 되기 직전에.`,
 26:p=>`사슬이 끊어졌다. 펜리르는 신화 속 늑대처럼 섬을 삼키고 걸어 나왔다.`,
 27:p=>`VBS 의수가 완성됐다. 기억은 돌아오지 않았지만, 에키온은 살아남았다. 누군가의 부탁대로.`,
 28:p=>`필름 한 통. 이 섬의 진실이 전부 담겨 있다. 마르티나의 특종이 세상을 뒤흔들 것이다.`,
 29:p=>`섬에서 가장 많은 밥을 지은 사람이 살아남았다. 쇼우는 다시 식당 문을 열 것이다.`,
 30:p=>`미르카는 살아서 돌아간다. 동생 마티아시가 기다리는 골목으로.`,
 31:p=>`원념이 깃든 권총이 마지막 피를 마셨다. 다음 주인을 찾아, 섬 밖으로.`,
 32:p=>`첫날을 넘기지 못했다. 이름조차 제대로 불리지 못한 채.`,
 33:p=>`싸움 끝에 쓰러졌다. 루미아 섬에서 가장 흔한 결말이다.`,
 34:p=>`믿었던 손이 칼을 쥐고 있었다. 마지막으로 본 건 동료의 얼굴이었다.`,
 35:p=>`버리고 도망친 동료가 살아 돌아왔다. "날 두고 갔잖아." 변명할 시간은 없었다.`,
 36:p=>`손목 장치가 비명을 질렀다. 금지구역은 예외를 두지 않는다.`,
 37:p=>`배고픔이 칼보다 먼저 찾아왔다.`,

function decideEnding(){
  const o=G.over,m=G.me,p=m.p,k=o.kind;
  if(o.win){
    if(k==='hack')return m.mageKilled?13:12;
    if(k==='escaped')return 11;
    if(k==='exit')return 14;
    if(p.id==='seres'&&m.allyIds.has('lucia'))return 20;
    if(p.id==='lucia'&&m.allyIds.has('seres'))return 21;
    if(p.id==='aya'&&(m.killedIds.has('jackie')||m.killedIds.has('isaac')))return 22;
    if(p.id==='jackie'&&m.kills>=5)return 23;
    if(p.id==='estelle'&&m.killedIds.has('adriana'))return 24;
    if(p.id==='blair'&&m.vfKill)return 25;
    if(p.id==='fenrir'&&domArc()==='r')return 26;
    if(p.id==='echion'&&m.wg>=4)return 27;
    if(p.id==='martina'&&m.film>=100)return 28;
    if(p.id==='xiukai'&&m.cooked>=5)return 29;
    if(p.id==='mirka'&&domArc()==='s')return 30;
    if(m.cursed||p.id==='cliver')return 31;
    if(m.chickenKing)return 16;
    if(m.nadja==='power')return 17;
    if(m.nadja==='truth')return 18;
    if(m.s7)return 19;
    if(m.allySacrifice)return 8;
    if(m.san<15)return 10;
    if(m.betrayer>=2)return 7;
    if(m.kills>=8)return 5;
    if(m.st.spare>=3)return 9;
    if(m.kills<=1)return 6;
    const a=domArc();if(a==='r')return 2;if(a==='s')return 3;if(a==='n')return 4;
    return 1;
  }
  if(k==='isekai')return 15;
  if(p.id==='jp'&&(m.code||m.area===LAB)&&G.labOpen)return 50;
  if(o.phase===0&&!['chicken','meme','truck'].includes(k))return 32;
  if(k==='kill'){const K=G.lastKiller;if(K&&K.kind==='boss')return K.b.isMage?43:44;const n=K&&K.n;if(n&&n.abandoned)return 35;if(n&&(n.betrayedMe||n.wasAlly))return 34;if(o.rank===2)return 48;return 33}
  const MAP={zone:36,hunger:37,bleed:38,trap:39,beast:40,chicken:41,mad:42,quake:45,meteor:45,storm:45,fire:45,gas:45,shock:45,drown:45,poison:46,bee:46,meme:47,mimic:47,fall:47,heat:47,drone:47,truck:47,escape:49,vf:51};
  return MAP[k]||52;
}
const END_KEY='lumia_endings_v1';

const RN={tank:'탱커',bruiser:'근접 전사',gun:'원거리 딜러',ranger:'사냥꾼',assassin:'암살자',mage:'술사',support:'서포터'};
function ctrText(r){const s=Object.entries(CTR[r]||{}).filter(([,v])=>v>1).map(([k])=>RN[k]),w=Object.entries(CTR[r]||{}).filter(([,v])=>v<1).map(([k])=>RN[k]);return[s.length?`${s.join('·')}에 강함`:'',w.length?`${w.join('·')}에 약함`:''].filter(Boolean).join(' / ')||'무난함'}
const ROLEMOVE={assassin:'밤에는 잠든 실험체를 습격할 수 있다. 정면 싸움은 약하다.',tank:'버티며 상대를 물러서게 하거나 몸으로 공격을 받아낸다.',bruiser:'정면으로 들이받아 먼저 칠 수 있다.',gun:'거리를 두고 먼저 쏘거나 기습에서 빠지며 쏜다.',ranger:'거리를 두고 먼저 쏜다.',mage:'주문으로 약한 상대를 쫓아낸다.',support:'다친 실험체를 치료해 우호를 쌓는다.'};
function profileSheet(id,canStart){
  const p=BY[id];
  openSheet(`${profileCard(p)}${canStart?`<button class="btn-main" id="go">${esc(J(p.n,'으로'))} 참가</button>`:''}`);
  if(canStart)document.getElementById('go').onclick=()=>{closeSheet();start(id)};
}
function openSheet(html,tabs){
  const s=document.getElementById('sheet');
  s.innerHTML=`<div class="scrim" id="scrim"></div><div class="panel" role="dialog" aria-modal="true">${tabs||''}<button class="x" id="sx" aria-label="닫기">닫기</button><div class="pbody" id="pbody">${html}</div></div>`;
  document.getElementById('scrim').onclick=closeSheet;document.getElementById('sx').onclick=closeSheet;
}
function closeSheet(){const s=document.getElementById('sheet');if(s)s.innerHTML=''}

/* ---------- game ---------- */
function start(pid){
  curPid=pid;initRun(pid);
  app.innerHTML=`<header class="top"><div class="wrap hudwrap" id="hud"></div></header>
  <main class="wrap game" id="stage"></main>
  <nav class="dock"><div class="in">
    <button data-s="bag">가방</button><button data-s="map">지도</button><button data-s="who">생존자</button><button data-s="log">기록</button><button data-s="dex">도감</button>
  </div></nav><div id="sheet"></div>`;
  document.querySelector('.dock').onclick=e=>{const b=e.target.closest('button');if(b)infoSheet(b.dataset.s)};
  render();scrollTo(0,0);
}
function hud(){
  const m=G.me,al=allies(),tot=alive().length+1;
  const zone=G.zones.has(m.area)?`<span class="badge red">금지구역 ${m.zt}턴</span>`:G.next.includes(m.area)?'<span class="badge amber">곧 금지</span>':G.finalArea===m.area?'<span class="badge cyan">안전지대</span>':'';
  const bar=(l,v,mx,c,low)=>`<div><span>${l} ${Math.max(0,Math.round(v))}</span><div class="bar"><i style="width:${pct(v,mx)}%;background:${v<low?'var(--red)':c}"></i></div></div>`;
  const extra=[];
  if(m.p.id==='jp')extra.push(`<span class="chip hid">데이터 <b>${m.frag}/5</b>${m.code?' · 코드 ✓':''}${G.labOpen?' · 연구소 개방':''}</span>`);
  if(hasP('film'))extra.push(`<span class="chip hid">촬영 <b>${m.film}%</b></span>`);
  extra.push(`<span class="chip skill">「${esc(m.p.act.n)}」 <b>${m.fcd>0?m.fcd+'턴':'준비'}</b></span>`);
  document.getElementById('hud').innerHTML=`
  <div class="h1"><b class="ph">${phaseName(G.phase)}${G.phase>=FINAL?' · 최종':''}</b><span class="sp"></span><span>선택 <b>${G.choices}</b></span><span>생존 <b>${tot}</b>/24</span></div>
  <div class="h2"><span class="me">${esc(m.p.n)}</span><span class="loc">${esc(m.area)}</span>${zone}${m.bleed?'<span class="badge red">출혈</span>':''}${m.san<40?'<span class="badge red">정신 불안</span>':''}${m.drunk>0?'<span class="badge amber">취함</span>':''}</div>
  <div class="bars">${bar('체력',m.hp,m.max,'var(--ok)',35)}${bar('정신',m.san,100,'var(--violet)',40)}${bar('포만',m.full,100,'var(--amber)',25)}</div>
  <div class="chips"><span class="chip">무기 <b class="g${m.wg}">${esc(myWname())}</b></span><span class="chip">방어구 <b class="g${m.ag}">${GR[m.ag]}</b></span><span class="chip">숙련 <b>${MG[m.ml]}</b></span><span class="chip">처치 <b>${m.kills}</b></span>${extra.join('')}${al.map(a=>`<span class="chip ally">동맹 ${esc(nm(a))} <b>${Math.max(0,Math.round(a.hp))}</b></span>`).join('')}</div>`;
}
const LINE_CLS={'crit-bad':'crit-bad','crit-good':'crit-good','crit-win':'crit-win',pick:'pick',news:'news',warn:'warn',bad:'bad',good:'good',phase:'phase',dead:'dead',win:'win'};
function render(){
  hud();
  const S=document.getElementById('stage');
  if(G.mode==='over'){S.innerHTML=endCard();bindEnd();scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}
  const c=G.card;
  const picked=G.mode==='result'?G.log.slice(G.cardMark).find(e=>e.c==='pick'):null;
  let h=`<article class="card ${c.cls||''}">
    <div class="ctag"><span>${esc(c.tag)}</span><span>${esc(G.me.area)} · ${phaseName(G.phase)}</span></div>
    <h2>${esc(c.title)}</h2>
    <div class="ctext">${esc(c.text).split('\n').map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(G.mode==='card'){
    h+=`<div class="olist">${c.opts.map((o,i)=>{const en=optEnabled(o);return`<button data-i="${i}" class="opt ${en?'':'dis'} ${o.warn?'warn':''} ${o.urgent?'urgent':''} ${o.skill?'skill':''} ${o.role?'role':''}" ${en?'':'aria-disabled="true"'}><span class="l">${esc(o.l)}</span>${!en?`<span class="d req">${esc(o.req||'')}</span>`:o.urgent&&o.d?`<span class="d">${esc(o.d)}</span>`:''}</button>`}).join('')}</div>`;
  }else{
    const lines=G.result.lines;
    h+=`<div class="chosen">▸ ${esc(picked?picked.t:'')}</div><div class="result">${lines.map(e=>`<p class="${LINE_CLS[e.c]||''}">${esc(e.t).replace(/\n/g,'<br>')}</p>`).join('')}</div>
    <button class="btn-main cont" id="cont">${G.over?'결과 보기':'계속'}</button>`;
  }
  h+='</article>';
  S.innerHTML=h;
  if(G.mode==='card')S.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=c.opts[+b.dataset.i];if(!optEnabled(o))return;pickOpt(o);render();const r=S.querySelector('.chosen');if(r){const y=r.getBoundingClientRect().top+scrollY-(document.querySelector('.top').offsetHeight+12);scrollTo({top:Math.max(0,y),behavior:RM()?'auto':'smooth'})}});
  else{const b=document.getElementById('cont');b.onclick=()=>{cont();render();scrollTo({top:0,behavior:RM()?'auto':'smooth'})};}
}

/* ---------- island map ---------- */
const MAPXY={"주유소":[37,8],"골목길":[57,8],"절":[82,22],"양궁장":[24,26],"경찰서":[63,26],"학교":[33,35],"소방서":[53,36],"개울":[80,39],"호텔":[15,43],"연구소":[45,48],"연못":[63,46],"병원":[88,55],"모래사장":[16,57],"숲":[39,60],"묘지":[66,59],"성당":[50,70],"고급 주택가":[27,72],"공장":[86,76],"창고":[40,83],"항구":[60,85]};
function mapSVG(){
  const m=G.me,W=100,H=100,P=a=>MAPXY[a];
  const roads=[];const seenE=new Set();for(const a of AREAS)for(const b of ADJ[a]){const k=[a,b].sort().join('|');if(seenE.has(k))continue;seenE.add(k);const[x1,y1]=P(a),[x2,y2]=P(b);const closed=(a===LAB||b===LAB)&&!G.labOpen;roads.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="road ${closed?'closed':''}"/>`)}
  const D=G.finalArea?distMap(G.finalArea):null;
  const seen=a=>others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).length;
  const nodes=AREAS.map(a=>{const[x,y]=P(a);const cls=['node'];if(G.zones.has(a))cls.push('z');else if(G.next.includes(a))cls.push('nx');if(a===m.area)cls.push('cur');if(a===G.finalArea)cls.push('safe');if(a===LAB)cls.push(G.labOpen?'labopen':'lab');
    const marks=[];if(G.specials[a])marks.push(`<circle cx="${x+3.6}" cy="${y-3.6}" r="1.5" class="mk gold"/>`);if(G.drop===a)marks.push(`<rect x="${x-5.1}" y="${y-5.1}" width="2.8" height="2.8" class="mk gold"/>`);if(G.boss&&G.boss.area===a)marks.push(`<circle cx="${x+3.6}" cy="${y+3.6}" r="1.5" class="mk red"/>`);if(m.p.id==='jp'&&G.nodesKnown&&G.nodes.includes(a))marks.push(`<rect x="${x+2.3}" y="${y+2.3}" width="2.6" height="2.6" class="mk ${G.hacked.has(a)?'done':'cyan'}"/>`);const s=seen(a);if(s)marks.push(`<text x="${x-4.6}" y="${y+5.4}" class="cnt">${s}</text>`);
    return`<g class="${cls.join(' ')}"><circle cx="${x}" cy="${y}" r="${a===LAB?4.4:3.2}"/>${a===m.area?`<circle cx="${x}" cy="${y}" r="5.6" class="ring"/>`:''}${a===LAB&&!G.labOpen?`<path d="M${x-1.4} ${y-.2}h2.8v2.2h-2.8z M${x-.9} ${y-.2}v-1a.9.9 0 0 1 1.8 0v1" class="lock"/>`:''}${marks.join('')}<text x="${x}" y="${y-5.2}" class="lbl">${esc(a)}${D&&a!==G.finalArea&&a===m.area?` · ${D[a]??'?'}칸`:''}</text></g>`}).join('');
  return`<div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="루미아 섬 지도">
    <path class="sea" d="M0 0H100V100H0Z"/>
    <path class="island" d="M30 2 L70 2 L78 10 L92 14 L96 30 L95 48 L97 62 L94 80 L80 88 L70 92 L64 95 L52 93 L44 92 L30 88 L18 82 L10 70 L6 54 L4 40 L8 26 L16 14 Z"/><path class="island" d="M68 90 L80 88 L86 94 L76 99 L68 96 Z"/><text x="80" y="95" class="lbl dim">???</text><path class="labzone" d="M45 39 L55 48 L45 57 L35 48 Z"/>
    ${roads.join('')}${nodes}
  </svg>
  <ul class="legend"><li><i class="lg cur"></i>현재 위치</li><li><i class="lg z"></i>금지구역</li><li><i class="lg nx"></i>곧 금지</li><li><i class="lg safe"></i>최종 안전지대</li><li><i class="lg gold"></i>특수 재료·보급</li><li><i class="lg red"></i>보스</li><li><i class="lg cnt">2</i>목격된 실험체</li>${m.p.id==='jp'?'<li><i class="lg cyan"></i>보안 노드</li>':''}</ul></div>`;
}

/* ---------- info sheets ---------- */
function infoSheet(k){
  const tabs=`<div class="tabs">${[['bag','가방'],['map','지도'],['who','생존자'],['log','기록'],['dex','도감']].map(([t,l])=>`<button data-t="${t}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>`;
  openSheet(sheetBody(k),tabs);
  document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)infoSheet(b.dataset.t)};
  const pb=document.getElementById('pbody');
  if(k==='dex')pb.onclick=e=>{const b=e.target.closest('[data-id]');if(b){const d=b.nextElementSibling;d.hidden=!d.hidden}};
  if(k==='bag')pb.onclick=e=>{const b=e.target.closest('[data-use]');if(b&&!G.over&&G.mode==='card'){useItem(b.dataset.use);clampInv();render();infoSheet('bag')}};
  if(k==='log')pb.scrollTop=pb.scrollHeight;
}
function sheetBody(k){
  const m=G.me;
  if(k==='bag'){
    const sp=Object.entries(m.sp).filter(([,v])=>v>0);
    const canUse=G.mode==='card'&&!G.over;
    const use=[['food','식량 먹기','포만감 +22',m.inv.food],['meal','음식 먹기','체력 +10 · 포만감 +35',m.it.meal],['bandage','붕대 감기','체력 +20 · 출혈 멈춤',m.it.bandage],['sedative','진정제 먹기','정신 +18',m.it.sedative]];
    return `<h4>바로 쓰기${canUse?'':' · 장면을 넘긴 뒤 쓸 수 있다'}</h4><div class="use">${use.map(([k2,l,d,n])=>`<button data-use="${k2}" ${!n||!canUse?'disabled':''}><b>${l}</b><span>${d} · ${n}개</span></button>`).join('')}</div>
    <h4>무기</h4><p><b class="g${m.wg}">[${GR[m.wg]}] ${esc(myWname())}</b> <span class="muted">${esc(m.p.w)} · 숙련 ${MG[m.ml]}${m.p.id==='echion'?' · 숙련도에 따라 진화':''}</span></p>
    <h4>재료</h4><div class="grid">${Object.entries(MATN).map(([key,l])=>`<div class="cell"><span>${l}</span><b>${m.inv[key]}</b></div>`).join('')}</div>
    <h4>덫</h4><p>${m.it.trap}개 · 교전 중이나 특정 장면에서 쓸 수 있다.</p>
    <h4>특수 재료</h4><p class="muted">${sp.length?sp.map(([s,v])=>`${esc(s)} ×${v}`).join(', '):'없음. 운석·생명의 나무는 방송된 지역에서, 미스릴·포스 코어·VF 혈액 샘플은 알파·감마·오메가·위클라인에게서 얻는다.'}</p>
    <h4>제작법 · 작업대 장면에서 만든다</h4><ul class="rec">${recipes().map(r=>`<li class="${canPay(r)?'ok':''}"><b>${esc(r.l)}</b><span>${esc(costText(r))}</span></li>`).join('')}</ul>`;
  }
  if(k==='map'){
    return mapSVG()+`<ul class="maplist">${AREAS.map(a=>{
      const t=[];if(a===m.area)t.push('<span class="badge cyan">현재 위치</span>');
      if(a===LAB&&!G.labOpen)t.push('<span class="badge">봉쇄</span>');
      if(G.zones.has(a))t.push('<span class="badge red">금지구역</span>');else if(G.next.includes(a))t.push('<span class="badge amber">곧 금지</span>');
      if(G.finalArea===a)t.push('<span class="badge cyan">안전지대</span>');
      if(G.specials[a])t.push(`<span class="badge gold">${esc(G.specials[a])}</span>`);if(G.drop===a)t.push('<span class="badge gold">보급 상자</span>');if(G.boss&&G.boss.area===a)t.push(`<span class="badge red">${esc(G.boss.name)}</span>`);
      if(G.ptraps[a])t.push(`<span class="badge">내 덫 ${G.ptraps[a]}</span>`);
      const seen=others().filter(n=>n.seen&&n.seen.area===a&&n.seen.phase>=G.phase-1).map(nm);
      return `<li class="${a===m.area?'cur':''} ${G.zones.has(a)?'z':''}"><div><b>${esc(a)}</b>${t.join('')}</div><span class="muted">재료 ${AREA_MATS[a].map(x=>MATN[x]).join('·')}${seen.length?` · 목격 ${esc(seen.join(', '))}`:''}</span></li>`}).join('')}</ul>`;
  }
  if(k==='who'){
    const al=G.npcs.filter(n=>n.alive),dd=G.dead;
    return `<h4>생존 ${al.length+1}명</h4><ul class="who"><li><b>${esc(m.p.n)}</b><span>나</span></li>${al.map(n=>`<li><b>${esc(nm(n))}</b><span>${n.team==='me'?'동맹':n.seen?`마지막 목격 ${esc(n.seen.area)} · ${phaseName(n.seen.phase)}`:'위치 모름'}${n.abandoned?' · 원한':n.hostile&&n.team!=='me'?' · 적대':''}</span></li>`).join('')}</ul>
    <h4>사망 ${dd.length}명</h4><ul class="who dead">${dd.map(d=>`<li><b>${esc(d.n)}</b><span>${esc(d.how)} · ${esc(d.when)}</span></li>`).join('')||'<li class="muted">아직 없음</li>'}</ul>`;
  }
  if(k==='log')return `<ol class="journal">${G.log.map(e=>`<li class="${LINE_CLS[e.c]||''}">${e.c==='pick'?'▸ ':''}${esc(e.t).replace(/\n/g,'<br>')}</li>`).join('')}</ol>`;
  if(k==='dex'){
    const list=[m.p,...G.npcs.map(n=>n.c)];
    return `<p class="muted">이번 실험 참가자 24명. 이름을 누르면 행동 양식이 펼쳐진다.</p><ul class="dex">${list.map(p=>`<li><button data-id="${p.id}"><b>${esc(p.n)}</b><span>${esc(RN[p.role])} · ${esc(traitsText(p).join(' · '))}</span></button><div hidden>${profileCard(p)}</div></li>`).join('')}</ul>`;
  }
  return '';
}

/* ---------- end ---------- */
function endCard(){
  const o=G.over,m=G.me,E=getEnding(),S=scoreRun();
  return `<section class="end ${o.win?'w':''}">
    <div class="eyebrow">${o.win?'Experiment complete':'Subject terminated'}</div>
    <div class="endno">엔딩 #${String(E.no).padStart(2,'0')}${E.isNew?' <span class="badge gold">새 엔딩</span>':''}</div>
    <div class="et">${esc(E.title)}</div>
    <p class="muted">${esc(m.p.n)} · ${o.win?'1위':`${o.rank}위`} · ${phaseName(o.phase)}</p>
    <p class="etext">${esc(E.text)}</p>
    <p class="muted">${esc(o.text)}</p>
    <div class="score">
      <div class="grade g-${S.grade[0]}"><span>연구 등급</span><b>${S.grade}</b></div>
      <div class="pts"><span>실험 점수</span><b>${S.total.toLocaleString()}</b><small>아글라이아 평가 · 다음 등급까지 ${S.gi<RCUT.length-1?(RCUT[S.gi+1]-S.total).toLocaleString()+'점':'최고 등급'}</small></div>
    </div>
    <table class="breakdown"><tbody>${S.rows.map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td><td class="num">+${Math.round(r[2]).toLocaleString()}</td></tr>`).join('')}</tbody></table>
    ${m.killed.length?`<p><span class="muted">처치한 실험체</span><br>${esc(m.killed.join(', '))}</p>`:''}
    ${m.allyHist.length?`<p><span class="muted">함께했던 동맹</span><br>${esc(m.allyHist.join(', '))}</p>`:''}
    <p class="muted">엔딩 도감 ${loadEndings().length}/52${!jpUnlocked()&&loadEndings().length>=5?'':''}</p>
    <div class="acts"><button class="again" id="again">${esc(J(m.p.n,'으로'))} 다시</button><button id="pickagain">다른 실험체 선택</button></div>
    <button class="copy" id="cp">결과 복사</button><div class="copied" id="cpm"></div>
  </section>`;
}
function bindEnd(){
  document.getElementById('again').onclick=()=>start(curPid);
  document.getElementById('pickagain').onclick=()=>{selectScreen();scrollTo(0,0)};
  document.getElementById('cp').onclick=()=>{const o=G.over,m=G.me,E=getEnding(),S=scoreRun();const txt=`[루미아 섬 생존 일지]\n${m.p.n} · ${o.win?'1위':o.rank+'위'} · 엔딩 #${String(E.no).padStart(2,'0')} ${E.title}\n연구 등급 ${S.grade} · ${S.total.toLocaleString()}점 · 히든 ${m.st.hidden.length}/${HIDDEN_TOTAL}\n${phaseName(o.phase)} · 선택 ${G.choices} · 처치 ${m.kills}\n${E.text}`;const el=document.getElementById('cpm');
    try{navigator.clipboard.writeText(txt).then(()=>el.textContent='복사했습니다.',()=>el.textContent=txt)}catch(e){el.textContent=txt}};
}
selectScreen();

</script>
</body>
</html>
